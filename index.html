<script>/* ===== Núcleo de cálculo (sin DOM) ===== */
const Core = (() => {
  const MES = ["", "enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const n = v => (typeof v === "number" ? v : (v === "" || v == null || isNaN(+v) ? 0 : +v));
  const money = (v, dec = 2) => (v < 0 ? "−" : "") + "$\u00a0" + Math.abs(n(v)).toLocaleString("es-AR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const pct = (v, sign = true) => v === "" || v == null || !isFinite(v) ? "s/d" : (sign && v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  const label = id => { const [y, m] = String(id).split("-"); return `${MES[+m]} ${y}`; };
  const labelCap = id => { const s = label(id); return s.charAt(0).toUpperCase() + s.slice(1); };
  const short = id => { const [y, m] = String(id).split("-"); return `${MES[+m].slice(0,3)} ${y.slice(2)}`; };
  const sum = (rows, f) => rows.reduce((a, r) => a + n(typeof f === "function" ? f(r) : r[f]), 0);
  const groupSum = (rows, key, val = "Importe") => { const m = new Map(); rows.forEach(r => m.set(r[key], (m.get(r[key]) || 0) + n(r[val]))); return m; };
  const U = { amarillo: .20, naranja: .30, rojo: .50, extremo: 1.0 };

  function make(data) {
    const S = data.sheets;
    const periods = [...S.PERIODOS].sort((a, b) => n(a.Periodo_Num) - n(b.Periodo_Num));
    const ids = periods.map(p => p.ID_Periodo);
    const P = id => periods.find(p => p.ID_Periodo === id);
    const withSpend = periods.filter(p => n(p.Total_Gastos_Periodo) > 1).map(p => p.ID_Periodo);
    const prevOf = id => { const i = withSpend.indexOf(id); if (i > 0) return withSpend[i - 1]; const before = withSpend.filter(x => x < id); return before.length ? before[before.length - 1] : null; };
    const G = id => S.GASTOS.filter(g => g.ID_Periodo === id);
    const EV = id => S.EVOLUCION.find(e => e.ID_Periodo === id) || {};
    const fondo = (id, f) => S.FONDOS.find(x => x.ID_Periodo === id && x.Fondo === f) || {};
    const totalGastos = id => sum(G(id), "Importe");
    const varPct = (a, b) => (b ? a / b - 1 : null);
    const nivel = v => { if (v == null) return null; const a = Math.abs(v); return a > U.extremo ? "rojo" : a > U.rojo ? "rojo" : a > U.naranja ? "naranja" : a > U.amarillo ? "amarillo" : "verde"; };

    function breakdown(id, key) {
      const cur = groupSum(G(id), key), pv = prevOf(id), prev = pv ? groupSum(G(pv), key) : new Map();
      const keys = new Set([...cur.keys(), ...prev.keys()]); const tot = totalGastos(id);
      return [...keys].map(k => { const a = cur.get(k) || 0, b = prev.get(k) || 0; return { key: k, actual: a, anterior: b, dif: a - b, var: varPct(a, b), share: tot ? a / tot : 0 }; })
        .filter(r => r.actual || r.anterior).sort((x, y) => y.actual - x.actual || y.anterior - x.anterior);
    }
    function series(key, value) { return ids.map(id => ({ id, v: groupSum(G(id), key).get(value) || 0 })); }

    function signals(id) {
      const out = []; const pv = prevOf(id); const p = P(id) || {}; const tg = totalGastos(id);
      const base = n(p.Base_Prorrateo_Ord);
      if (tg > 1 && Math.abs(base - tg) > 1000) out.push({ nivel: "rojo", titulo: "Se prorrateó más de lo que se gastó",
        texto: `Entre las unidades se repartieron ${money(base)}, pero el total de gastos del mes es ${money(tg)}: una diferencia de ${money(base - tg)} (${pct(base / tg - 1)}). La liquidación no explica la diferencia.`, tipo: "Cálculo" });
      const sd = S.EGRESOS_CAJA.filter(e => e.ID_Periodo === id && e.Tipo_Egreso === "EGRESO SIN DETALLE DE COMPROBANTE");
      if (sd.length) { const t = -sum(sd, "Importe"); out.push({ nivel: t > tg * .1 ? "rojo" : "naranja", titulo: "Pagos sin comprobante detallado",
        texto: `Salieron de la cuenta ${money(t)} en ${sd.length} pago(s) que no corresponden a gastos detallados en la liquidación: ${sd.map(e => `${e.Concepto} (${money(-n(e.Importe))})`).join("; ")}.`, tipo: "Dato" }); }
      const fo = fondo(id, "ORDINARIO"); if (n(fo.Saldo_Final_Documento) < 0) out.push({ nivel: "rojo", titulo: "Fondo ordinario en negativo", texto: `El fondo ordinario cerró en ${money(fo.Saldo_Final_Documento)}.`, tipo: "Dato" });
      const pn = n(p.Periodo_Num);
      const dups = G(id).filter(g => g.Posible_Duplicado && S.GASTOS.some(o => n(o.Periodo_Num) < pn && o.Concepto_Normalizado === g.Concepto_Normalizado && n(o.Importe) === n(g.Importe) && o.Comprobante === g.Comprobante));
      if (dups.length) out.push({ nivel: "naranja", titulo: "Posible gasto repetido", texto: `Mismo concepto, importe y comprobante que en otro mes: ${[...new Set(dups.map(g => g.Concepto_Normalizado))].join(", ")} (${money(sum(dups,"Importe"))}). Puede ser un error de carga o un pago doble; hay que verificar la factura.`, tipo: "Cálculo" });
      const est = G(id).filter(g => g.Es_Estimado === "SI");
      if (est.length) out.push({ nivel: "amarillo", titulo: "Gastos estimados", texto: `Se liquidaron importes estimados, no facturados: ${est.map(g => `${g.Concepto_Normalizado} (${money(g.Importe)})`).join("; ")}.`, tipo: "Dato" });
      if (pv) {
        breakdown(id, "Concepto_Normalizado").forEach(r => {
          if (!r.anterior) out.push({ nivel: "info", titulo: `Nuevo: ${r.key}`, texto: `Aparece este mes por ${money(r.actual)}; no figuraba en ${label(pv)}.`, tipo: "Cálculo" });

        if (/^TOTAL\b/.test(U)) { R.saldos_pendientes_total = val(L, 400, 640); mode = "none"; continue; }
        let u = null; for (const i of L.its) { const m = i.s.match(/\|\s*(\d+-\d+)/); if (m) u = m[1]; else if (u && i.s !== "$" && /^-?[\d.]+,\d{2}$/.test(i.s)) { R.saldos_pendientes.push({ unidad: u, importe: num(i.s) }); u = null; } }
        continue;
      }
      if (mode === "recibo") {
        const left = L.its.filter(i => i.x < 400 && !/C O P I A/.test(i.s)); const lt = left.map(i => i.s).join(" ");
        const amt = () => { const t = left.filter(i => /^-?\d+(\.\d+)?$/.test(i.s)); return t.length ? numDot(t[t.length - 1].s) : null; };
        if (/^Periodo:/.test(lt)) { rec.periodo = per(lt); rec.saldo = amt(); }
        else if (/Su Pago/.test(lt)) { rec.fecha_pago = iso(lt); rec.importe_pagado = amt(); }
        else if (/Saldo a favor/.test(lt)) rec.saldo_a_favor = amt();
        else if (/^Deuda/.test(lt)) rec.deuda = amt();
        else if (/^Expensas Ord/.test(lt)) rec.expensas_ord = amt();
        else if (/^Expensas Ext/.test(lt)) rec.expensas_ext = amt();
        else if (/^Intereses por mora/.test(lt)) rec.intereses = amt();
        else if (/^TOTAL/.test(lt)) rec.total = amt();
        else if (/^\d+-\d+$/.test(lt)) rec.unidad = lt;
        else if (/^Lugar y forma/.test(lt)) rec._f = true;
        else if (rec._f && !/^Talón/.test(lt)) { if (lt) rec.forma.push(lt); }
        else if (/^Talón/.test(lt)) rec._f = false;
        continue;
      }
    }
    closeItem(); closePa();
    R.recibos = R.recibos.map(r => ({ nro: r.nro, periodo: r.periodo, unidad: r.unidad || R.cupon.unidad, saldo: r.saldo, fecha_pago: r.fecha_pago, importe_pagado: r.importe_pagado, saldo_a_favor: r.saldo_a_favor,
      deuda: r.deuda, expensas_ord: r.expensas_ord, expensas_ext: r.expensas_ext, intereses: r.intereses, total: r.total, forma_pago: r.forma.join(" ").replace(/_ /g, "_").replace(/(\d) _/g, "$1_").replace(/\s+/g, " ").trim() }));
    if (!R.periodo) R.dudas.push({ campo: "Período", detalle: "No se encontró 'Liquidación: M/AAAA'.", pagina: 1 });
    if (!R.prorrateo.length) R.dudas.push({ campo: "Prorrateo", detalle: "No se encontró el estado de cuentas por unidad.", pagina: 2 });
    if (R.total_gastos == null) R.dudas.push({ campo: "Total de gastos", detalle: "No se encontró 'TOTAL DE GASTOS'.", pagina: 2 });

  }

<script>/* ===== Interfaz ===== */
const CFG = window.PORTAL_CONFIG;
const { money, pct, label, labelCap, short, n } = Core;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CAT_COLORS = { "SEGURIDAD": "#2E5A45", "MANTENIMIENTO": "#6E9C7F", "ADMINISTRACIÓN": "#A7C2AF", "SERVICIOS PÚBLICOS": "#C99312", "SERVICIOS": "#E3C66C",
  "SEGUROS": "#7F8F87", "IMPUESTOS Y TASAS": "#C4CCC6", "PERSONAL": "#4C7A63", "LIMPIEZA": "#9DB8A5", "JARDINERÍA": "#5F8E70", "OBRAS": "#8C6A3C", "OTROS": "#B9B2A6" };
const NIV = { rojo: ["Revisar con prioridad", "lv-rojo"], naranja: ["Revisar", "lv-naranja"], amarillo: ["A tener en cuenta", "lv-amarillo"], info: ["Cambio", "lv-info"], verde: ["Sin observaciones", "lv-verde"] };
const ccNivel = s => s.startsWith("🔴") ? "rojo" : s.startsWith("🟠") ? "naranja" : s.startsWith("🟡") ? "amarillo" : "verde";
const cents = v => { const s = money(v); const i = s.lastIndexOf(","); return `${esc(s.slice(0, i))}<span class="cts">${esc(s.slice(i))}</span>`; };
const titleCase = s => s.charAt(0) + s.slice(1).toLowerCase();

let C, DATA, sel, view = "inicio", charts = [], range = "todo", metric = "lote", alertFilter = "todos";
const state = { token: sessionStorage.getItem("portal_token") || "", draft: null };

async function load() {
  let data = null, source = "snapshot";
  if (CFG.API_URL) {
    try { const r = await fetch(CFG.API_URL + "?action=data", { cache: "no-store" }); data = await r.json(); if (!data.sheets) throw new Error(data.error || "Respuesta inválida"); source = "en vivo"; }
    catch (e) { console.warn(e); toast("No se pudo leer la base en vivo. Se muestran los datos guardados en la página."); }
  }
  if (!data) data = JSON.parse(document.getElementById("snapshot").textContent);
  DATA = data; C = Core.make(data);
  if (CFG.API_URL && state.token) { fetch(`${CFG.API_URL}?action=docs&token=${encodeURIComponent(state.token)}`).then(r => r.json()).then(j => { if (j.docs) state.docs = j.docs; }).catch(() => {}); }
  sel = C.withSpend[C.withSpend.length - 1] || C.ids[C.ids.length - 1];
  $("#src").textContent = `Datos ${source} · actualizados ${data.updated || ""}`.replace(" · ", " — ");
  const s = $("#periodo"); s.innerHTML = [...C.ids].reverse().map(id => `<option value="${id}">${labelCap(id)}</option>`).join(""); s.value = sel;
  render();
}
function go(v) { view = v; document.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === v || (v !== "inicio" && v !== "evolucion" && v !== "gastos" && v !== "alertas" && b.dataset.go === "mas" && b.closest(".tabs")))); $("#mas").hidden = true; render(); window.scrollTo({ top: 0 }); }
function render() {
  charts.forEach(c => c.destroy()); charts = [];
  const V = { inicio, evolucion, gastos, alertas, proveedores, caja, cobranza, documentos, historico, cargar, asamblea }[view] || inicio;
  $("#main").innerHTML = V(); bind();
  $("#periodo").closest(".pick").style.visibility = ["evolucion", "historico", "cargar", "proveedores", "cobranza"].includes(view) ? "hidden" : "visible";
  if (window.Chart) after.forEach(f => f()); after = [];
}
let after = [];
function bind() {
  document.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => { const t = document.getElementById(el.dataset.toggle); t.hidden = !t.hidden; el.setAttribute("aria-expanded", !t.hidden); });
  document.querySelectorAll("[data-range]").forEach(el => el.onclick = () => { range = el.dataset.range; render(); });
  document.querySelectorAll("[data-metric]").forEach(el => el.onclick = () => { metric = el.dataset.metric; render(); });
  document.querySelectorAll("[data-af]").forEach(el => el.onclick = () => { alertFilter = el.dataset.af; render(); });
  document.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => go(el.dataset.goto));
  if (view === "cargar") bindCargar();
}

/* ---------- Inicio ---------- */
function inicio() {
  const p = C.P(sel), pv = C.prevOf(sel), tg = C.totalGastos(sel);

  const lt = n(p.Expensa_Ord_Lote_Tipo), ltp = pv ? n(C.P(pv).Expensa_Ord_Lote_Tipo) : 0, v = pv ? lt / ltp - 1 : null;
  const cats = C.breakdown(sel, "Categoria").filter(c => c.actual > 0);
  const sig = C.signals(sel), imp = sig.filter(s => s.nivel === "rojo" || s.nivel === "naranja"), val = C.validations(sel);
  const ev = C.EV(sel);
  return `
  <section class="hero">
    <h1>${labelCap(sel)}</h1>
    <p class="hero-k">Un lote común (coeficiente 5,67%) paga</p>
    <p class="hero-n">${cents(lt)}</p>

    <div class="bar100" role="img" aria-label="Distribución del gasto por categoría">${cats.map(c => `<span style="flex:${c.share};background:${CAT_COLORS[c.key] || "#999"}" title="${esc(c.key)}"></span>`).join("")}</div>
    <ul class="cien-list">${cats.map(c => `<li><i style="background:${CAT_COLORS[c.key] || "#999"}"></i><b>$\u00a0${(c.share * 100).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b><span>${esc(titleCase(c.key))}</span></li>`).join("")}</ul>
    <p class="fine">Total de gastos del mes: ${money(tg)}.</p>
  </section>
  <section>
    <h2>Lo que tenés que saber</h2>
    <ul class="story">${C.narrative(sel).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    ${imp.length ? `<button class="link" data-goto="alertas">${imp.length} ${imp.length === 1 ? "punto importante para revisar" : "puntos importantes para revisar"}</button>` : ""}
  </section>
  <section class="stats">
    <div><span>Gastos del mes</span><b>${money(tg)}</b><em>${pv ? pct(C.varPct(tg, C.totalGastos(pv))) : ""}</em></div>
    <div><span>Cuenta del barrio al cierre</span><b>${money(ev.Saldo_Caja_Final)}</b></div>

  </section>
  <section>
    <h2>Preguntas frecuentes</h2>
    <div class="faq">${C.faq(sel).map(([q, a], i) => `<button class="q" data-toggle="faq${i}" aria-expanded="false">${esc(q)}</button><p id="faq${i}" hidden>${esc(a)}</p>`).join("")}</div>
  </section>`;
}

/* ---------- Evolución ---------- */
const METRICS = {
  lote: ["Expensa de un lote", id => n(C.P(id).Expensa_Ord_Lote_Tipo)],
  gastos: ["Gastos del mes", id => C.totalGastos(id)],
  seguridad: ["Seguridad", id => n(C.EV(id).Seguridad)],
  caja: ["Cuenta al cierre", id => n(C.EV(id).Saldo_Caja_Final)],
  deuda: ["Deuda de unidades", id => n(C.EV(id).Deudas_A_Cobrar) + n(C.EV(id).Intereses_A_Cobrar)],

function evolucion() {
  let ids = metric === "lote" || metric === "gastos" || metric === "seguridad" ? C.withSpend : C.ids;
  if (range !== "todo") ids = ids.slice(-(+range));
  const [name, f] = METRICS[metric]; const vals = ids.map(f);
  const avg = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
  after.push(() => line("#ch-evo", ids.map(short), [{ label: name, data: vals }]));
  const first = vals[0], last = vals[vals.length - 1];
  return `<section><h1>Evolución</h1>
  <div class="chips" role="group" aria-label="Indicador">${Object.entries(METRICS).map(([k, [t]]) => `<button data-metric="${k}" class="${k === metric ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="chips small" role="group" aria-label="Período">${[["3", "3 meses"], ["6", "6 meses"], ["12", "12 meses"], ["todo", "Todo"]].map(([k, t]) => `<button data-range="${k}" class="${k === range ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="chart"><canvas id="ch-evo"></canvas></div>
  <p class="fine">${ids.length > 1 ? `De ${label(ids[0])} a ${label(ids[ids.length - 1])}: ${pct(C.varPct(last, first))}. Promedio: ${money(avg)}. Máximo: ${money(Math.max(...vals))}. Mínimo: ${money(Math.min(...vals))}.` : ""}</p>
  <table class="tbl"><thead><tr><th>Mes</th><th class="r">${esc(name)}</th><th class="r">Var.</th><th class="r">vs. promedio</th></tr></thead><tbody>
  ${ids.map((id, i) => `<tr><td>${labelCap(id)}</td><td class="r">${money(vals[i])}</td><td class="r">${i ? pct(C.varPct(vals[i], vals[i - 1])) : "—"}</td><td class="r">${avg ? pct(vals[i] / avg - 1) : "—"}</td></tr>`).join("")}
  </tbody></table>
  <h2>Cada categoría, mes a mes</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Categoría</th>${C.withSpend.map(id => `<th class="r">${short(id)}</th>`).join("")}<th class="r">Promedio</th></tr></thead><tbody>
  ${[...new Set(DATA.sheets.GASTOS.map(g => g.Categoria))].map(cat => { const v = C.withSpend.map(id => C.G(id).filter(g => g.Categoria === cat).reduce((a, g) => a + n(g.Importe), 0)); const avg = v.reduce((a, b) => a + b, 0) / v.length;
    return `<tr><td>${esc(titleCase(cat))}</td>${v.map((x, i) => `<td class="r${i && v[i - 1] && Math.abs(x / v[i - 1] - 1) > .2 ? " hl" : ""}">${money(x, 0)}</td>`).join("")}<td class="r">${money(avg, 0)}</td></tr>`; }).join("")}
  </tbody></table></div><p class="fine">Resaltado: variación mayor a 20% contra el mes anterior. Importes redondeados al peso solo en esta tabla.</p></section>`;
}

/* ---------- Gastos ---------- */
function gastos() {
  const pv = C.prevOf(sel), cats = C.breakdown(sel, "Categoria"), max = Math.max(...cats.map(c => c.actual), 1), tg = C.totalGastos(sel);
  return `<section><h1>Gastos de ${label(sel)}</h1><p class="lead">${money(tg)} en total${pv ? `, ${pct(C.varPct(tg, C.totalGastos(pv)))} contra ${label(pv)}` : ""}. Tocá una categoría para ver el detalle.</p>
  <ul class="cats">${cats.map((c, i) => {
    const conc = C.breakdown(sel, "Concepto_Normalizado").filter(r => C.G(sel).concat(pv ? C.G(pv) : []).some(g => g.Concepto_Normalizado === r.key && g.Categoria === c.key));

  const items = C.G(sel).filter(g => g.Concepto_Normalizado === r.key);
  const tag = r.anterior ? pct(r.var) : r.actual ? "nuevo" : "sin importe este mes";
  return `<div class="c"><div class="c-h"><b>${esc(r.key)}</b><span>${money(r.actual)}</span></div>
    <p class="c-m">${r.anterior ? `Mes anterior ${money(r.anterior)} · ` : ""}${tag}</p>
    ${items.map(g => `<details><summary>${esc(g.Proveedor)} — ${money(g.Importe)}${g.Es_Estimado === "SI" ? " · estimado" : ""}${g.Posible_Duplicado ? " · posible duplicado" : ""}</summary>
      <dl><dt>Texto de la liquidación</dt><dd>${esc(g.Concepto_Original)}</dd>
      <dt>Rubro y página</dt><dd>${esc(g.Rubro_Original)} · pág. ${esc(g.Pagina)} · ${esc(g.Fuente_PDF)}</dd>

/* ---------- Alertas ---------- */
function alertas() {

  const card = x => `<article class="al ${NIV[x.nivel][1]}"><p class="al-n">${NIV[x.nivel][0]} · ${esc(x.tipo)}</p><h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p>${x.extra ? `<p class="al-x">${esc(x.extra)}</p>` : ""}</article>`;

  </section>`;
}

/* ---------- Para la administración ---------- */
function asamblea() {
  const qs = C.questions(sel), txt = `Consultas sobre la liquidación de ${label(sel)} (${CFG.BARRIO}):\n\n` + qs.map((x, i) => `${i + 1}. ${x.q}: ${x.d}`).join("\n\n");

/* ---------- Proveedores ---------- */
function spark(vals) { const w = 96, h = 26, m = Math.max(...vals, 1); const pts = vals.map((v, i) => `${(i / Math.max(vals.length - 1, 1) * w).toFixed(1)},${(h - v / m * (h - 2) - 1).toFixed(1)}`).join(" "); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#2E5A45" stroke-width="1.6"/></svg>`; }
function proveedores() {

  <ul class="provs">${rows.map(p => `<li><div><b>${esc(p.Proveedor)}</b><span>${esc(titleCase(p.Categoria))} · ${n(p.Cantidad_Periodos)} ${n(p.Cantidad_Periodos) === 1 ? "mes" : "meses"} · ${pct(n(p.Participacion_Total), false)} del total</span></div>
    <div class="pv-r">${spark(p.vals)}<b>${money(p.Total_Facturado)}</b><span>Último ${money(p.Ultimo_Importe)} · ${typeof p.Variacion === "number" ? pct(p.Variacion) : "sin mes anterior"}</span></div></li>`).join("")}</ul></section>`;
}

/* ---------- Caja y fondos ---------- */
function caja() {
  const ids = C.ids, mov = DATA.sheets.EGRESOS_CAJA.filter(e => e.ID_Periodo === sel), ing = DATA.sheets.INGRESOS.filter(e => e.ID_Periodo === sel);
  const unpaid = C.unpaidHistoric();
  after.push(() => line("#ch-caja", ids.map(short), [{ label: "Total", data: ids.map(id => n(C.EV(id).Saldo_Caja_Final)) }, { label: "Fondo ordinario", data: ids.map(id => n(C.EV(id).Fondo_Ord_Final)) }, { label: "Fondo extraordinario", data: ids.map(id => n(C.EV(id).Fondo_Ext_Final)) }]));
  const tipoTxt = { "PAGO DE GASTOS LIQUIDADOS": "Pago de gastos detallados", "RECLASIFICACIÓN DE COBROS": "Reclasificación contable (no es salida de dinero real)", "EGRESO SIN DETALLE DE COMPROBANTE": "Sin comprobante detallado", "AJUSTE": "Ajuste" };
  return `<section><h1>Caja y fondos</h1><p class="lead">Cuánta plata tiene el barrio al cierre de cada mes. La liquidación no informa un fondo de reserva.</p>
  <div class="chart"><canvas id="ch-caja"></canvas></div>
  <h2>Movimientos de ${label(sel)}</h2>
  <table class="tbl"><tbody>
   <tr><td>Saldo inicial</td><td class="r">${money(C.fondo(sel, "TOTAL").Saldo_Inicial)}</td></tr>
   ${ing.map(e => `<tr><td>${esc(e.Concepto)} <small>(${esc(e.Fondo.toLowerCase())})</small></td><td class="r pos">${money(e.Importe)}</td></tr>`).join("")}
   ${mov.map(e => `<tr class="${e.Tipo_Egreso === "EGRESO SIN DETALLE DE COMPROBANTE" ? "flag" : ""}"><td>${esc(e.Concepto)} <small>${esc(tipoTxt[e.Tipo_Egreso] || "")}</small></td><td class="r">${money(e.Importe)}</td></tr>`).join("")}
   <tr class="tot"><td>Saldo al cierre</td><td class="r">${money(C.fondo(sel, "TOTAL").Saldo_Final_Documento)}</td></tr></tbody></table>
  <h2>Gastos sin pago identificado</h2>
  <p>Gastos liquidados que quedaron pendientes y no aparecen pagados en las liquidaciones siguientes: ${money(Core.sum(unpaid, "Importe"))}. Pueden haberse cancelado con pagos sin detalle; la información disponible no permite confirmarlo.</p>
  <table class="tbl"><thead><tr><th>Mes</th><th>Concepto</th><th class="r">Importe</th></tr></thead><tbody>${unpaid.map(g => `<tr><td>${short(g.ID_Periodo)}</td><td>${esc(g.Concepto_Normalizado)}</td><td class="r">${money(g.Importe)}</td></tr>`).join("")}</tbody></table>
  <h2>Patrimonio neto</h2>
  <table class="tbl"><tbody>${ids.map(id => `<tr><td>${labelCap(id)}</td><td class="r">${money(C.EV(id).Patrimonio_Neto)}</td></tr>`).join("")}</tbody></table>
  <p class="fine">El estado patrimonial de la liquidación solo descuenta los gastos pendientes del mes en curso.</p></section>`;
}

/* ---------- Cobranza ---------- */
function cobranza() {
  const ids = C.ids;
  after.push(() => bars("#ch-cob", ids.map(short), [{ label: "Deuda (capital)", data: ids.map(id => n(C.EV(id).Deudas_A_Cobrar)) }, { label: "Intereses", data: ids.map(id => n(C.EV(id).Intereses_A_Cobrar)) }]));
  return `<section><h1>Cobranza</h1><p class="lead">Lo que las unidades le deben al barrio. Se muestra solo el total: el detalle por unidad no es público.</p>
  <div class="chart"><canvas id="ch-cob"></canvas></div>
  <table class="tbl"><thead><tr><th>Mes</th><th class="r">Unidades con deuda</th><th class="r">Deuda + intereses</th></tr></thead><tbody>
  ${ids.map(id => `<tr><td>${labelCap(id)}</td><td class="r">${n(C.EV(id).Unidades_Con_Deuda)}</td><td class="r">${money(n(C.EV(id).Deudas_A_Cobrar) + n(C.EV(id).Intereses_A_Cobrar))}</td></tr>`).join("")}</tbody></table></section>`;
}

/* ---------- Documentos / Histórico ---------- */
function documentos() {
  const docs = DATA.sheets.DOCUMENTOS || [];
  return `<section><h1>Documentación</h1><p class="lead">Cada dato de la app se puede rastrear hasta la liquidación original: archivo y página.</p>
  <ul class="docs">${[...C.ids].reverse().map(id => { const p = C.P(id), v = C.validations(id), d = docs.find(x => x.ID_Periodo === id) || {}; const url = (state.docs || {})[id];
    return `<li><div><b>Liquidación ${esc(p.Liquidacion)}</b><span>Vence ${fmtDate(p.Fecha_Vencimiento)} · cierre ${fmtDate(p.Fecha_Cierre)} · ${esc(p.Paginas)} págs.</span><span>${esc(p.Fuente_PDF)}</span></div>
    <div class="pv-r"><b>${money(p.Total_Gastos_Periodo)}</b><span>${v.ok}/${v.total} controles OK · ${esc(p.Estado_Revision.toLowerCase())}</span>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Abrir PDF</a>` : `<span class="muted">PDF solo para administración</span>`}</div></li>`; }).join("")}</ul></section>`;
}
const fmtDate = s => { if (!s || s === "N/D") return "s/d"; const [y, m, d] = String(s).slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
function historico() {
  return `<section><h1>Histórico</h1><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="r">Gastos</th><th class="r">Prorrateado</th><th class="r">Lote común</th><th class="r">Ingresos</th><th class="r">Egresos</th><th class="r">Caja al cierre</th><th class="r">Patrimonio neto</th></tr></thead><tbody>
  ${C.periods.map(p => `<tr><td>${labelCap(p.ID_Periodo)}</td><td class="r">${money(p.Total_Gastos_Periodo)}</td><td class="r">${money(p.Base_Prorrateo_Ord)}</td><td class="r">${money(p.Expensa_Ord_Lote_Tipo)}</td><td class="r">${money(p.Ingresos)}</td><td class="r">${money(p.Egresos_Caja)}</td><td class="r">${money(p.Saldo_Final)}</td><td class="r">${money(p.Patrimonio_Neto)}</td></tr>`).join("")}
  </tbody></table></div><p class="fine">Importes tal como figuran en cada liquidación.</p></section>`;
}

/* ---------- Cargar ---------- */
function cargar() {
  const d = state.draft;
  return `<section><h1>Cargar una liquidación</h1>
  <p class="lead">Elegí el PDF tal como lo baja AdminProp. La app lo lee en tu navegador (sin costo), lo controla contra la base y te muestra el resultado. Nada se guarda hasta que confirmes.</p>
  ${CFG.API_URL ? `<label class="fld">Clave de administración<input id="tok" type="password" autocomplete="off" value="${esc(state.token)}"></label>` : `<p class="note">Todavía no está conectada la planilla (falta pegar la dirección del script en <code>API_URL</code>). Podés probar la lectura del PDF igual: se muestra lo leído, pero no se guarda.</p>`}
  <label class="fld">PDF de la liquidación<input id="pdf" type="file" accept="application/pdf"></label>
  <button id="go-pdf" class="btn">Leer y controlar</button>
  <div id="busy" class="busy" hidden>Leyendo la liquidación…</div>
  <div id="prev">${d ? preview(d) : ""}</div></section>`;
}
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(pdfjsLib); }; s.onerror = () => rej(new Error("No se pudo cargar el lector de PDF. Revisá la conexión.")); document.head.appendChild(s); });
}
function localPreview(liq, file) {
  const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
  return { periodo: liq.periodo, bloqueos: ["Vista previa local: la planilla no está conectada, no se puede incorporar."], draftId: null,
    resumen: { "Período": liq.periodo, "Archivo": file, "Total de gastos": liq.total_gastos, "Prorrateado entre unidades": (liq.prorrateo_totales || {}).gastos_ord, "Expensa lote común": (liq.cupon || {}).gastos_ord, "Caja al cierre": ((liq.fondos || {}).TOTAL || {}).saldo_final, "Ítems de gasto": String(liq.gastos.length), "Unidades": String(liq.prorrateo.length) },
    controles: [{ control: "Suma de ítems = TOTAL DE GASTOS", documento: liq.total_gastos, calculado: Math.round(sum(liq.gastos.map(g => g.importe)) * 100) / 100, ok: Math.abs(sum(liq.gastos.map(g => g.importe)) - liq.total_gastos) < 0.01 }],
    gastos: liq.gastos.map(g => ({ concepto_original: g.concepto_original, concepto_normalizado: g.rubro, categoria: "—", importe: g.importe })), observaciones: [], dudas: liq.dudas };
}
function preview(d) {
  const r = d.resumen || {}, bloq = d.bloqueos || [];
  return `<h2>Resultado: liquidación ${esc(d.periodo)}</h2>
  <table class="tbl"><tbody>${Object.entries(r).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${typeof v === "number" ? money(v) : esc(v)}</td></tr>`).join("")}</tbody></table>
  ${bloq.length ? `<article class="al lv-rojo"><h3>No se puede incorporar todavía</h3><ul>${bloq.map(b => `<li>${esc(b)}</li>`).join("")}</ul></article>` : ""}
  <h2>Controles (${d.controles.filter(c => c.ok).length} de ${d.controles.length} cierran)</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Control</th><th class="r">Liquidación</th><th class="r">Calculado</th><th></th></tr></thead><tbody>
  ${d.controles.map(c => `<tr class="${c.ok ? "" : "flag"}"><td>${esc(c.control)}</td><td class="r">${money(c.documento)}</td><td class="r">${money(c.calculado)}</td><td>${c.ok ? "✓" : "✗"}</td></tr>`).join("")}</tbody></table></div>
  <h2>Gastos leídos (${d.gastos.length})</h2>
  <table class="tbl"><thead><tr><th>Concepto</th><th>Categoría</th><th class="r">Importe</th></tr></thead><tbody>
  ${d.gastos.map(g => `<tr class="${g.sin_regla ? "flag" : ""}"><td>${esc(g.concepto_normalizado)}<small>${esc(String(g.concepto_original).slice(0, 90))}</small></td><td>${esc(g.categoria)}</td><td class="r">${money(g.importe)}</td></tr>`).join("")}</tbody></table>
  ${(d.observaciones || []).length ? `<h2>Observaciones que se van a registrar</h2><ul class="story">${d.observaciones.map(o => `<li>${esc(o.importancia)} ${esc(o.dato)}: ${esc(o.problema)}</li>`).join("")}</ul>` : ""}
  ${(d.dudas || []).length ? `<h2>Datos que la lectura no pudo confirmar</h2><ul class="story">${d.dudas.map(o => `<li>${esc(o.campo)}: ${esc(o.detalle)} (pág. ${esc(o.pagina)})</li>`).join("")}</ul>` : ""}
  ${d.draftId ? `<div class="actions">${bloq.length ? `<label class="chk"><input type="checkbox" id="force"> Incorporar igual y dejar todo marcado como REVISAR</label>` : ""}
  <button id="commit" class="btn">Incorporar a la base</button><button id="discard" class="btn ghost">Descartar</button></div>` : ""}`;
}
async function api(body) {
  const r = await fetch(CFG.API_URL, { method: "POST", body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
function bindCargar() {
  if (!$("#go-pdf")) return;
  $("#go-pdf").onclick = async () => {
    const f = $("#pdf").files[0]; if (!f) return toast("Elegí el PDF de la liquidación.");
    $("#busy").hidden = false; $("#go-pdf").disabled = true;
    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      const lib = await loadPdfJs();
      const liq = await LiqParser.fromFile(lib, buf.slice());
      if (!liq.periodo || !liq.gastos.length) throw new Error("No se reconoció el formato de la liquidación. ¿Es el PDF original de AdminProp?");
      if (!CFG.API_URL) { state.draft = localPreview(liq, f.name); }
      else {
        state.token = $("#tok").value.trim(); sessionStorage.setItem("portal_token", state.token);
        let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        const j = await api({ action: "preview", token: state.token, filename: f.name, json: JSON.stringify(liq), pdfBase64: btoa(bin) });
        state.draft = j.preview;
      }
      $("#prev").innerHTML = preview(state.draft); bindPreview();
    } catch (e) { toast(e.message); } finally { $("#busy").hidden = true; $("#go-pdf").disabled = false; }
  };
  if (state.draft) bindPreview();
}
function bindPreview() {
  const c = $("#commit"), d = $("#discard"); if (!c) return;
  c.onclick = async () => { c.disabled = true; try { const j = await api({ action: "commit", token: state.token, draftId: state.draft.draftId, force: !!($("#force") && $("#force").checked) }); toast(`Liquidación ${j.periodo} incorporada.`); state.draft = null; await load(); go("inicio"); } catch (e) { toast(e.message); c.disabled = false; } };
  d.onclick = () => { state.draft = null; render(); };
}

/* ---------- Gráficos ---------- */
const PAL = ["#2E5A45", "#C99312", "#8FB39B", "#B0412E"];
function baseOpts() { return { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
  plugins: { legend: { labels: { font: { family: "Plus Jakarta Sans" }, boxWidth: 12 } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${money(c.parsed.y)}` } } },
  scales: { y: { ticks: { callback: v => "$ " + (Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " M" : (v / 1e3).toLocaleString("es-AR", { maximumFractionDigits: 0 }) + " mil") }, grid: { color: "#E4E8E2" } }, x: { grid: { display: false } } } }; }
function line(sel_, labels, sets) { const el = $(sel_); if (!el) return; charts.push(new Chart(el, { type: "line", data: { labels, datasets: sets.map((s, i) => ({ ...s, borderColor: PAL[i], backgroundColor: PAL[i], tension: 0, pointRadius: 3 })) }, options: baseOpts() })); }
function bars(sel_, labels, sets) { const el = $(sel_); if (!el) return; const o = baseOpts(); o.scales.x.stacked = o.scales.y.stacked = true; charts.push(new Chart(el, { type: "bar", data: { labels, datasets: sets.map((s, i) => ({ ...s, backgroundColor: PAL[i], borderRadius: 3 })) }, options: o })); }

let toastT; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 5000); }
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => b.dataset.go === "mas" ? ($("#mas").hidden = !$("#mas").hidden) : go(b.dataset.go));
  $("#periodo").onchange = e => { sel = e.target.value; render(); };
  document.title = `Expensas ${CFG.BARRIO}`; $("#barrio").textContent = CFG.BARRIO;
  load();
});
</script>
</body>
</html>
