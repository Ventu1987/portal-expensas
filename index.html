<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expensas</title>
<meta name="theme-color" content="#1F5C46">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

};

<style>
:root{--bg:#F3F6F4;--card:#FFFFFF;--ink:#1E2B27;--muted:#56665F;--line:#DCE4DF;--brand:#1F5C46;--brand-soft:#E3EEE8;
 --ok:#2E7D57;--ok-soft:#E1F1E7;--sun:#B97A10;--sun-soft:#FCF1DC;--red:#B8402F;--red-soft:#F8E3DF;--sky:#2F6CA8;--sky-soft:#E2ECF6;
 --font:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs:17px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-size="2"]{--fs:19px}:root[data-size="3"]{--fs:21px}
*,*::before,*::after{box-sizing:inherit}
html{font-size:var(--fs);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem;font-weight:700}
h1{font-size:1.6rem}h2{font-size:1.2rem;margin-top:2.2rem}h3{font-size:1.02rem}
p{margin:.45rem 0}small{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.ico{width:1.35em;height:1.35em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem}
.brand{flex:1 0 auto;line-height:1.2}.brand b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{font-size:.8rem;opacity:.85}
.top select{flex:0 1 auto;min-width:0;font:700 .9rem var(--font);color:var(--brand);background:#fff;border:0;border-radius:10px;padding:.5rem .4rem;max-width:12.5rem;font-size:.88rem}
@media (max-width:520px){.brand{display:none}}
.size{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:.45rem .6rem;font-weight:700}
main{max-width:720px;margin:0 auto;padding:1.1rem 1rem 7rem}
main.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.3}to{opacity:1}}
.intro{background:var(--sky-soft);border-radius:12px;padding:.75rem .9rem;font-size:.92rem;margin:.6rem 0 1rem}
.intro b{color:var(--sky)}
.muted{color:var(--muted)}.fine{color:var(--muted);font-size:.82rem}
/* inicio */
.hola{font-size:1.05rem;color:var(--muted);margin:.2rem 0 .8rem}
.hero{background:var(--card);border-radius:20px;padding:1.2rem 1.2rem 1rem;box-shadow:0 1px 2px rgba(30,43,39,.06),0 8px 24px rgba(30,43,39,.06)}
.hero .k{color:var(--muted);margin:0}
.hero .n{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:.25rem 0 .5rem;font-variant-numeric:tabular-nums}
.hero .n small{font-size:.42em;color:var(--muted);letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.3rem .75rem;font-weight:700;font-size:.92rem}
.chip.up{background:var(--sun-soft);color:var(--sun)}.chip.down{background:var(--ok-soft);color:var(--ok)}.chip.flat{background:var(--brand-soft);color:var(--brand)}
.spark{display:flex;align-items:flex-end;gap:6px;height:64px;margin:1rem 0 .3rem;padding:0;border:0;background:none;width:100%}
.spark span{flex:1;background:var(--brand-soft);border-radius:6px 6px 2px 2px;position:relative}
.spark span.cur{background:var(--brand)}
.spark-l{display:flex;gap:6px;font-size:.72rem;color:var(--muted)}.spark-l span{flex:1;text-align:center}
.venc{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line);font-size:.93rem}
.venc .ico{color:var(--brand);margin-top:.1rem}
.sema{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.15rem;border:0;border-radius:14px;padding:.85rem .9rem;background:var(--card);border-left:6px solid var(--line);min-height:6.2rem}
.tile .t{font-size:.86rem;color:var(--muted);display:flex;gap:.35rem;align-items:center}
.tile .d{font-weight:700;font-size:1.05rem;line-height:1.25}
.tile .e{font-size:.78rem;font-weight:700;margin-top:auto}
.tile.verde{border-left-color:var(--ok)}.tile.verde .e{color:var(--ok)}
.tile.amarillo{border-left-color:#E9A23B}.tile.amarillo .e{color:var(--sun)}
.tile.rojo{border-left-color:var(--red)}.tile.rojo .e{color:var(--red)}
.tile.gris{border-left-color:var(--line)}
.dona{display:grid;grid-template-columns:1fr;gap:1rem;background:var(--card);border-radius:16px;padding:1rem}
@media (min-width:600px){.dona{grid-template-columns:240px 1fr;align-items:center}}
.dona-c{position:relative;height:220px}
.dona-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dona-mid b{font-size:1.6rem}.dona-mid span{font-size:.82rem;color:var(--muted);max-width:7.5rem}
.leg{list-style:none;margin:0;padding:0}
.leg button{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:.55rem .5rem}
.leg button[aria-pressed="true"]{background:var(--brand-soft)}
.leg i{width:14px;height:14px;border-radius:4px}
.leg b{font-variant-numeric:tabular-nums}
.catinfo{background:var(--bg);border-radius:12px;padding:.75rem .9rem;margin-top:.4rem;font-size:.93rem}
.catinfo b{display:block}
.imp{background:var(--card);border-radius:14px;padding:1rem;margin:.7rem 0;border-left:6px solid var(--line)}
.imp.rojo{border-left-color:var(--red)}.imp.naranja{border-left-color:#D9822B}
.imp h3{margin:.1rem 0 .35rem}.imp .q{font-size:.93rem}
.imp details{margin-top:.5rem}.imp summary{color:var(--sky);font-weight:700;cursor:pointer;padding:.2rem 0}
.imp details p{font-size:.9rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:.75rem 1.1rem;font-weight:700;margin:.3rem .4rem .3rem 0;min-height:48px}
.btn.ghost{background:none;color:var(--brand);border:2px solid var(--brand)}.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:.3rem 0;color:var(--sky);font-weight:700;text-decoration:underline;text-underline-offset:3px}
/* genéricos */
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none}
.chips button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.45rem .9rem;font-weight:700;font-size:.9rem;min-height:44px}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.box{background:var(--card);border-radius:16px;padding:1rem;margin:.7rem 0}
.chart{position:relative;height:250px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;margin:.4rem 0}
.tbl th{font-weight:700;color:var(--muted);text-align:left;border-bottom:2px solid var(--line);padding:.45rem .35rem}
.tbl td{border-bottom:1px solid var(--line);padding:.55rem .35rem;vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.flag td{background:var(--sun-soft)}.tbl td.hl{background:var(--sun-soft)}.tbl tr.tot td{font-weight:700}
.tbl small{display:block}
.scroll{overflow-x:auto}
.pos{color:var(--ok)}
.cats{list-style:none;padding:0;margin:.6rem 0}
.cats>li{background:var(--card);border-radius:14px;margin:.6rem 0;overflow:hidden}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .7rem;align-items:center;width:100%;text-align:left;background:none;border:0;padding:.9rem}
.cat .ic{width:2.3rem;height:2.3rem;border-radius:10px;display:grid;place-items:center;color:#fff}
.cat .nm{font-weight:700;min-width:0}.cat .am{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-size:.95rem}
.cat .bar{grid-column:2/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.cat .bar span{display:block;height:100%;border-radius:4px}
.cat .mt{grid-column:2/-1;font-size:.84rem;color:var(--muted)}
.conc{padding:0 .9rem 1rem}
.conc .what{font-size:.9rem;background:var(--bg);border-radius:10px;padding:.6rem .75rem;margin-bottom:.6rem}
.c{border-top:1px solid var(--line);padding:.6rem 0}.c-h{display:flex;justify-content:space-between;gap:1rem}.c-h span{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.c-m{color:var(--muted);font-size:.84rem;margin:.1rem 0 .3rem}
details summary{cursor:pointer;font-size:.9rem;padding:.3rem 0;color:var(--sky);font-weight:700}
dl{margin:.3rem 0 .6rem;font-size:.88rem}dt{color:var(--muted);margin-top:.4rem}dd{margin:0}
.al{background:var(--card);border-left:6px solid var(--line);padding:.8rem .95rem;margin:.6rem 0;border-radius:0 14px 14px 0}
.al h3{margin:.1rem 0 .3rem}.al p{font-size:.92rem}.al-n{font-size:.8rem;color:var(--muted);margin:0;font-weight:700}.al-x{color:var(--muted)}
.lv-rojo{border-left-color:var(--red)}.lv-naranja{border-left-color:#D9822B}.lv-amarillo{border-left-color:#E9A23B}.lv-info{border-left-color:var(--sky)}
.empty{color:var(--muted);font-style:italic}
.list{list-style:none;padding:0;margin:.6rem 0}
.list>li{display:flex;justify-content:space-between;gap:1rem;background:var(--card);border-radius:12px;padding:.85rem .9rem;margin:.5rem 0}
.list span{display:block;color:var(--muted);font-size:.84rem}.list .r{text-align:right;flex:none}.list .r b{display:block;font-variant-numeric:tabular-nums}
.list .r svg{display:block;margin-left:auto}
.docs>li{flex-direction:column;gap:.3rem}.docs .r{text-align:left}
.glos dt{font-weight:700;color:var(--ink);font-size:1rem;margin-top:1rem}.glos dd{color:var(--muted)}
.qs{padding-left:1.3rem}.qs li{margin:1rem 0;padding-left:.3rem}.qs li p{margin:.2rem 0;color:var(--muted);font-size:.92rem}
.fld{display:block;margin:.9rem 0;font-weight:700}
.fld input,.fld select{display:block;width:100%;margin-top:.35rem;font:inherit;font-weight:400;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.busy{padding:.9rem;background:var(--brand-soft);border-radius:12px;margin:1rem 0}
.actions{margin:1.5rem 0}.chk{display:block;margin-bottom:.6rem}
.big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
/* hoja inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,27,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:1.2rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;animation:up .2s ease-out;max-width:720px;margin:0 auto}
@keyframes up{from{transform:translateY(30%);opacity:.6}to{transform:none;opacity:1}}
.sheet .x{float:right;background:var(--bg);border:0;border-radius:999px;width:2.4rem;height:2.4rem;font-size:1.2rem}
/* navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;background:none;border:0;padding:.55rem 0 .6rem;font-size:.74rem;color:var(--muted);font-weight:700;min-height:56px}
.tabs button.on{color:var(--brand)}.tabs button.on .ico{background:var(--brand-soft);border-radius:999px;padding:.15rem .9rem;box-sizing:content-box}
.mas{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--card);border-top:1px solid var(--line);padding:.4rem 1rem 1rem;max-height:70vh;overflow:auto}
.mas button{display:flex;gap:.8rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.8rem 0;font-weight:700}
.mas button small{display:block;font-weight:400}.mas .ico{color:var(--brand)}
.tabs .desk{display:none}
.foot{color:var(--muted);font-size:.78rem;max-width:720px;margin:0 auto;padding:0 1rem 7.5rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:12px;max-width:90vw;font-size:.92rem}
.tabs p.desk{display:none}
.kpis{display:grid;grid-template-columns:1fr;gap:.6rem;margin:.8rem 0}@media (min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card);border-radius:14px;padding:.85rem .95rem}.kpi span{display:block;color:var(--muted);font-size:.85rem}.kpi b{display:block;font-size:1.35rem;line-height:1.25;font-variant-numeric:tabular-nums}.kpi small{font-size:.8rem}
.rq{display:flex;gap:.7rem;align-items:flex-start;border-radius:14px;padding:.85rem .95rem;margin:.8rem 0}.rq p{margin:0}.rq.rojo{background:var(--red-soft)}.rq.rojo .ico{color:var(--red)}.rq.amarillo{background:var(--sun-soft)}
.hz{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;width:100%;text-align:left;background:var(--card);border:0;border-left:6px solid var(--line);border-radius:0 14px 14px 0;padding:.9rem 1rem;margin:.7rem 0;box-shadow:0 1px 2px rgba(30,43,39,.05)}
.hz:hover{box-shadow:0 4px 14px rgba(30,43,39,.10)}.hz.rojo{border-left-color:var(--red)}.hz.naranja{border-left-color:#D9822B}.hz.amarillo{border-left-color:#E9A23B}.hz.verde{border-left-color:var(--ok)}
.hz-top{display:flex;flex-wrap:wrap;gap:.35rem}.hz-t{font-size:1.08rem;line-height:1.3}.hz-s{color:var(--muted);font-size:.93rem}.hz-m{font-size:.95rem}.hz-n{font-size:.88rem}.hz-go{color:var(--sky);font-weight:700;font-size:.9rem}
.tag{display:inline-block;border-radius:999px;padding:.12rem .55rem;font-size:.75rem;font-weight:700;background:#E6ECE8;color:#46564F}
.tag.rojo{background:var(--red-soft);color:var(--red)}.tag.naranja{background:#FBE7D6;color:#A85A16}.tag.amarillo{background:var(--sun-soft);color:var(--sun)}.tag.verde{background:var(--ok-soft);color:var(--ok)}.tag.azul{background:var(--sky-soft);color:var(--sky)}.tag.sm{font-size:.7rem}
.plan{padding-left:1.3rem}.plan li{margin:.8rem 0}.plan p{margin:.15rem 0;color:var(--muted);font-size:.93rem}
.back{display:inline-flex;align-items:center;gap:.3rem;text-decoration:none;margin-bottom:.4rem}
.steps{background:var(--card);border-radius:14px;padding:.3rem 1rem}
.st{display:grid;grid-template-columns:2rem 1fr auto;gap:.7rem;align-items:start;padding:.7rem 0;border-bottom:1px solid var(--line)}.st:last-child{border-bottom:0}
.st-n{width:1.8rem;height:1.8rem;border-radius:999px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.st small{display:block;color:var(--muted);font-size:.82rem}.st-v{text-align:right}.st-v b{display:block;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:480px){.st{grid-template-columns:2rem 1fr}.st-v{grid-column:2;text-align:left}}
.tl{list-style:none;padding:0;margin:1rem 0 1rem .5rem;border-left:3px solid var(--line)}.tl li{position:relative;padding:.2rem 0 1rem 1.1rem}
.tl li::before{content:"";position:absolute;left:-.6rem;top:.45rem;width:.8rem;height:.8rem;border-radius:999px;background:var(--line);border:2px solid var(--bg)}
.tl li.rojo::before{background:var(--red)}.tl li.azul::before{background:var(--sky)}.tl-d{font-size:.8rem;color:var(--muted);display:block}.tl p{font-size:.92rem;margin:.2rem 0}
.row2{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--line)}.row2:last-child{border-bottom:0}
.grp{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem .8rem .3rem;font-weight:700}
.tbl sup{color:var(--sun);font-weight:700}
.tl li.verde::before{background:var(--ok)}.tl li.amar::before{background:#E9A23B}
.frm textarea,.frm select{display:block;width:100%;margin-top:.35rem;font:inherit;font-weight:400;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr;gap:0 .8rem}@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.evl{background:var(--card);border-radius:14px;padding:.2rem 1rem;margin:.6rem 0}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}.ev:last-child{border-bottom:0}
.ev small{display:block;color:var(--muted);font-size:.8rem}.ev-v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;max-width:12rem}
.ev-dot{width:.9rem;height:.9rem;border-radius:999px;background:var(--line)}.ev.verde .ev-dot{background:var(--ok)}.ev.amarillo .ev-dot{background:#E9A23B}.ev.rojo .ev-dot{background:var(--red)}
@media (max-width:480px){.ev{grid-template-columns:auto 1fr}.ev-v{grid-column:2;text-align:left}}
@media (min-width:900px){
 body{display:grid;grid-template-columns:240px 1fr}
 .top{grid-column:1/-1}
 .tabs{position:sticky;top:62px;height:calc(100vh - 62px);flex-direction:column;border-top:0;border-right:1px solid var(--line);background:var(--bg);padding:1rem .7rem;overflow:auto}
 .tabs button{flex:none;flex-direction:row;gap:.6rem;text-align:left;padding:.6rem .8rem;font-size:.95rem;border-radius:10px;min-height:44px}
 .tabs button.on{background:var(--brand-soft)}.tabs button.on .ico{background:none;padding:0}
 .tabs .desk{display:flex}.tabs p.desk{display:block}.tabs .mob{display:none}
 .mas{display:none!important}
 main{padding:1.8rem 2rem 4rem;margin:0;max-width:980px}.foot{margin:0;padding:0 2rem 2rem;grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><b>Expensas</b><span>Fideicomiso Bella Vista</span></div>
 <select id="barrioSel" aria-label="Barrio"></select>
 <select id="periodo" aria-label="Mes"></select>
 <button class="size" id="size" aria-label="Cambiar tamaño de letra" title="Tamaño de letra">A+</button>
</header>
<nav class="tabs" aria-label="Secciones" id="tabs"></nav>
<div id="mas" class="mas" hidden></div>
<main id="main"><p class="muted">Cargando…</p></main>
<p id="src" class="foot"></p>

 "", "Superficie_m2": 250000, "Coef_FBV_Propios": "", "Coef_FBV_Comunes": "", "Estado": "", "Fuente": "Superficie total informada (25 ha)"}], "HALLAZGOS": [{"ID_Hallazgo": "H01", "Orden": 1, "Gravedad": "CRÍTICO", "Titulo": "Se cobró más de lo que se gastó en septiembre", "Conclusion_Simple": "En septiembre, a los propietarios de los tres barrios se les pidió más plata que lo que se gastó en el mes: $4.474.330 de más entre los tres. En Senderos II, $1.627.055 (17%).", "Detalle_Tecnico": "En junio, julio y agosto lo repartido entre los lotes coincidió con el gasto del mes (diferencias de $30 a $45). En septiembre el salto es simultáneo en los tres barrios. La administración lo explicó como 'previsión de morosidad'. Para Senderos II el cálculo cierra aproximadamente: $9.565.568,34 × 1,17 = $11.191.714,96, $908,04 menos que lo repartido. La previsión no figura en ninguna línea de la liquidación, no se aplicó en los meses anteriores y no se informó cómo se devuelve cuando los morosos paguen. En Senderos I fue 10,7% y en La Huella 19,0%.", "Barrios": "S1,S2,LH", "Monto_Total": 4474330, "Impacto_S1": 1023710, "Impacto_S2": 1627055, "Impacto_LH": 1823565, "Tipo_Impacto": "A RECUPERAR", "Recurrencia": "ÚNICO", "Periodo_Afectado": "Septiembre 2026", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RESPONDIDO PARCIALMENTE", "Respuesta_Administracion": "Previsión de morosidad de lotes con deuda (aprox. 17% en Senderos II).", "Que_Pedir": "Composición exacta de la base de septiembre en cada barrio; por qué no se aplicó antes; cómo se devuelve o compensa el adelanto cuando los morosos paguen.", "Proximo_Paso": "Reiterar el pedido por escrito (el plazo de la carta 3 venció) y exigir que la previsión se informe como una línea separada en la liquidación.", "Fuentes": "Liquidaciones 06 a 09/2026; carta 3; resumen ejecutivo", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H02", "Orden": 2, "Gravedad": "CRÍTICO", "Titulo": "El 'mantenimiento' del Fideicomiso cobra casi la mitad del costo a barrios que son el 14% del predio", "Conclusion_Simple": "Los tres barrios ocupan alrededor del 14% del predio de 25 hectáreas, pero pagan el 43,8% del costo de mantenerlo. Senderos II paga $1.443.645 por mes por este concepto.", "Detalle_Tecnico": "El pozo de $10.665.223,73 se parte 80% 'propios' y 20% 'comunes' y a cada parte se le aplica un coeficiente por barrio. Senderos II: 13,73% y 12,76%. La aplicación es aritméticamente correcta, pero el criterio no está fundado: el corte 80/20 no tiene base de costo y los coeficientes difieren entre las dos mitades, lo que contradice que ambos se repartan por superficie. Según la administración, el mantenimiento cubre todo Nuevo Bella Vista (colegio, Vistana y tierra sin vender incluidos) con un criterio acordado con el desarrollador, que los propietarios no aprobaron. Superficies según relevamiento del propietario: el dato oficial debe pedirse.", "Barrios": "S1,S2,LH", "Monto_Total": 4670829, "Impacto_S1": 1611089, "Impacto_S2": 1443645, "Impacto_LH": 1616095, "Tipo_Impacto": "CRITERIO EN DISCUSIÓN", "Recurrencia": "", "Periodo_Afectado": "Mensual", "Verificacion": "VERIFICADO (CRITERIO)", "Estado_Reclamo": "RESPONDIDO SIN FUNDAMENTO", "Respuesta_Administracion": "Cubre todo el predio; criterio acordado con el desarrollador.", "Que_Pedir": "Fundamento del reparto; tabla completa de coeficientes y m² de todos los participantes del predio (período actual); fundamento del corte 80/20; detalle de tareas y frecuencia.", "Proximo_Paso": "Llevar a asamblea y elevar el planteo al Fideicomiso, coordinando con propietarios de Senderos I y La Huella.", "Fuentes": "Liquidaciones 09/2026 de los 3 barrios; respaldo de OP; carta 3", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H03", "Orden": 3, "Gravedad": "IMPORTANTE", "Titulo": "El 92% del 'mantenimiento' es el personal del Fideicomiso", "Conclusion_Simple": "Lo que se cobra como 'mantenimiento' es, en su gran mayoría, sueldos y cargas sociales del personal del Fideicomiso, que trabaja para todo el predio.", "Detalle_Tecnico": "Del total ajustado de $10.665.223,73, $9.833.981,59 (92,2%) son sueldos, cargas sociales, sindicato y honorarios de liquidación. Ningún empleado figura asignado a un barrio. Se necesita el convenio o acta que habilita trasladar esa nómina a los barrios (no hay escrituras ni consorcio constituido).", "Barrios": "S1,S2,LH", "Monto_Total": 9833982, "Impacto_S1": 1485523, "Impacto_S2": 1331128, "Impacto_LH": 1490155, "Tipo_Impacto": "CRITERIO EN DISCUSIÓN", "Recurrencia": "", "Periodo_Afectado": "Mensual", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RECLAMADO", "Respuesta_Administracion": "Indicó que el personal trabaja en todo el predio, incluidas obras y Vistana.", "Que_Pedir": "Convenio o acta que autoriza el traslado de la nómina; detalle de tareas por barrio; recibos de sueldo y F.931.", "Proximo_Paso": "Incluir en el pedido formal al Fideicomiso.", "Fuentes": "Respaldo de órdenes de pago; carta 3", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "TRANSPARENCIA", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H04", "Orden": 4, "Gravedad": "IMPORTANTE", "Titulo": "Electricidad industrial del Fideicomiso dentro del mantenimiento", "Conclusion_Simple": "Dentro del mantenimiento se reparte una factura de luz de tarifa industrial a nombre del Fideicomiso ($738.398). A Senderos II le toca $99.950 por mes.", "Detalle_Tecnico": "OP 2431: EDENOR cuenta 7884753119, tarifa T1-G2 industrial, $738.398,14. Es adicional al medidor propio de cada barrio. La administración dijo que Vistana se alimenta de la 'cuenta general' del Fideicomiso: si es esta cuenta, los propietarios estarían pagando luz de obra.", "Barrios": "S1,S2,LH", "Monto_Total": 738398.14, "Impacto_S1": 111542, "Impacto_S2": 99950, "Impacto_LH": 111889, "Tipo_Impacto": "A RECUPERAR", "Recurrencia": "MENSUAL", "Periodo_Afectado": "Mensual (si se repite)", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RECLAMADO", "Respuesta_Administracion": "Vistana se alimenta de la 'cuenta general' del Fideicomiso.", "Que_Pedir": "Confirmar si la OP 2431 (cuenta 7884753119) es esa 'cuenta general'; si lo es, excluirla de la base.", "Proximo_Paso": "Reiterar el pedido.", "Fuentes": "Respaldo OP 2431; carta 3", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H05", "Orden": 5, "Gravedad": "IMPORTANTE", "Titulo": "Honorarios de liquidación de sueldos del Fideicomiso", "Conclusion_Simple": "Se reparte entre los barrios un gasto administrativo propio del Fideicomiso: los honorarios de quien liquida sus sueldos ($101.000). A Senderos II le toca $13.671.", "Detalle_Tecnico": "OP 487: $101.000. Es un costo de la estructura del Fideicomiso y se suma a los honorarios que ya cobra la administradora RyM ($578.000 por barrio).", "Barrios": "S1,S2,LH", "Monto_Total": 101000, "Impacto_S1": 15257, "Impacto_S2": 13671, "Impacto_LH": 15305, "Tipo_Impacto": "A RECUPERAR", "Recurrencia": "MENSUAL", "Periodo_Afectado": "Mensual (si se repite)", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RECLAMADO", "Respuesta_Administracion": "", "Que_Pedir": "Excluirlo de la base o fundamentar por qué lo pagan los propietarios.", "Proximo_Paso": "Reiterar el pedido.", "Fuentes": "Respaldo OP 487; carta 3", "Mes": "2026-09", "Publ .824.", "Detalle_Tecnico": "OP 489 ($650.000, 14/08) y OP 490 ($250.000, 20/08) corresponden a dos empleados que figuran con su sueldo neto completo en la planilla de agosto (OP 492). Si fueron adelantos, debían descontarse.", "Barrios": "S1,S2,LH", "Monto_Total": 900000, "Impacto_S1": 135954, "Impacto_S2": 121824, "Impacto_LH": 136377, "Tipo_Impacto": "A CONFIRMAR", "Recurrencia": "ÚNICO", "Periodo_Afectado": "Septiembre 2026", "Verificacion": "A CONFIRMAR", "Estado_Reclamo": "PENDIENTE DE RECLAMAR", "Respuesta_Administracion": "", "Que_Pedir": "Recibos de sueldo de esos dos empleados mostrando si los adelantos se descontaron, o el concepto de esos pagos.", "Proximo_Paso": "Agregar al próximo pedido.", "Fuentes": "Respaldo OP 489, 490 y 492", "Mes": "2026-09", "Publicable": "SI", "Estado": "ABIERTO", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H08", "Orden": 8, "Gravedad": "A REVISAR", "Titulo": "Seguridad compartida con Senderos I: mitad y mitad, no por lotes", "Conclusion_Simple": "Senderos I y II comparten una sola factura de seguridad y la pagan mitad cada uno. Senderos II tiene menos lotes (18 contra 21): repartiendo por lote, pagaría $455.243 menos por mes.", "Detalle_Tecnico": "Factura FC06570 de Cruz de Malta: $11.836.324,87 por un puesto 24 horas. Se reparte $5.918.162,43 a cada barrio. No hay doble cobro: el reparto coincide con la factura. Por cantidad de lotes: $11.836.324,87 × 18 / 39 = $5.462.919,17 para Senderos II. Es un cambio de criterio: lo que baja en Senderos II lo pagaría Senderos I.", "Barrios": "S1,S2", "Monto_Total": 455243.26, "Impacto_S1": -455243, "Impacto_S2": 455243, "Impacto_LH": 0, "Tipo_Impacto": "REDISTRIBUCIÓN", "Recurrencia": "MENSUAL", "Periodo_Afectado": "Mensual", "Verificacion": "VERIFICADO (CRITERIO)", "Estado_Reclamo": "RECLAMADO", "Respuesta_Administracion": "", "Que_Pedir": "Recti   const ym = id => String(id).slice(-7).split("-");
  const label = id => { const [y, m] = ym(id); return `${MES[+m]} ${y}`; };
  const labelCap = id => { const s = label(id); return s.charAt(0).toUpperCase() + s.slice(1); };
  const short = id => { const [y, m] = ym(id); return `${MES[+m].slice(0,3)} ${y.slice(2)}`; };
  const sum = (rows, f) => rows.reduce((a, r) => a + n(typeof f === "function" ? f(r) : r[f]), 0);
  const groupSum = (rows, key, val = "Importe") => { const m = new Map(); rows.forEach(r => m.set(r[key], (m.get(r[key]) || 0) + n(r[val]))); return m; };
  const U = { amarillo: .20, naranja: .30, rojo: .50, extremo: 1.0 };

  function make(data, barrio) {

    const periods = S.PERIODOS.filter(p => !barrio || p.Barrio === barrio).sort((a, b) => n(a.Periodo_Num) - n(b.Periodo_Num));
    const ids = periods.map(p => p.ID_Periodo);
    const P = id => periods.find(p => p.ID_Periodo === id);
    const withSpend = periods.filter(p => n(p.Total_Gastos_Periodo) > 1).map(p => p.ID_Periodo);
    const prevOf = id => { const i = withSpend.indexOf(id); if (i > 0) return withSpend[i - 1]; const before = withSpend.filter(x => x < id); return before.length ? before[before.length - 1] : null; };

    const EV = id => S.EVOLUCION.find(e => e.ID_Periodo === id) || {};

    const totalGastos = id => sum(G(id), "Importe");
    const varPct = (a, b) => (b ? a / b - 1 : null);
    const nivel = v => { if (v == null) return null; const a = Math.abs(v); return a > U.extremo ? "rojo" : a > U.rojo ? "rojo" : a > U.naranja ? "naranja" : a > U.amarillo ? "amarillo" : "verde"; };

    function breakdown(id, key) {

      const keys = new Set([...cur.keys(), ...prev.keys()]); const tot = totalGastos(id);
      return [...keys].map(k => { const a = cur.get(k) || 0, b = prev.get(k) || 0; return { key: k, actual: a, anterior: b, dif: a - b, var: varPct(a, b), share: tot ? a / tot : 0 }; })

      if (sd.length) { const t = -sum(sd, "Importe"); out.push({ nivel: t > tg * .1 ? "rojo" : "naranja", titulo: "Pagos sin comprobante detallado",

      const pn = n(p.Periodo_Num);
      const dups = G(id).filter(g => g.Posible_Duplicado && S.GASTOS.some(o => n(o.Periodo_Num) < pn && o.Concepto_Normalizado === g.Concepto_Normalizado && n(o.Importe) === n(g.Importe) && o.Comprobante === g.Comprobante));
      if (dups.length) out.push({ nivel: "naranja", titulo: "Posible gasto repetido", texto: `Mismo concepto, importe y comprobante que en otro mes: ${[...new Set(dups.map(g => g.Concepto_Normalizado))].join(", ")} (${money(sum(dups,"Importe"))}). Puede ser un error de carga o un pago doble; hay que verificar la factura.`, tipo: "Cálculo" });

        ["¿Qué gasto aumentó más este mes?", up ? `${up.key}: ${pct(up.var)} (de ${money(up.anterior)} a ${money(up.actual)}).` : "No hay mes anterior para comparar."],

        ["¿Hubo gastos extraordinarios?", `Formalmente no: la liquidación no tiene gastos extraordinarios. Gastos puntuales o poco frecuentes este mes: ${nr.length ? nr.map(g => `${g.Concepto_Normalizado} (${money(g.Importe)})`).join(", ") : "ninguno"}.`],

        (/repetido/i.test(s.titulo) && /duplicaci|mismo concepto/.test(ccTxt)) || (/negativo/i.test(s.titulo) && ccTxt.includes("negativo"));
      signals(id).filter(s => (s.nivel === "rojo" || s.nivel === "naranja") && !cubierto(s)).forEach(s => out.push({ nivel: s.nivel, q: s.titulo, d: s.texto }));

    }

<script>/* ===== Lector de liquidaciones AdminProp (100% en el navegador, sin costo) ===== */
const LiqParser = (() => {
  async function getLines(pdf) {
    const all = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const pg = await pdf.getPage(p), tc = await pg.getTextContent();
      const its = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str.trim(), x: i.transform[4], y: i.transform[5] }))
        .filter(i => !(i.x < 15 && /Generada por AdminProp/.test(i.s)));
      its.sort((a, b) => b.y - a.y || a.x - b.x);
      const lines = [];
      for (const it of its) {
        const L = lines[lines.length - 1];
        if (L && L.lastY - it.y <= 4.5) { L.its.push(it); L.lastY = it.y; } else lines.push({ p, y: it.y, lastY: it.y, its: [it] });
      }
      lines.forEach(L => { L.its.sort((a, b) => a.x - b.x); L.text = L.its.map(i => i.s).join(" ").replace(/\s+/g, " ").trim(); });
      all.push(...lines.filter(L => !(L.its.length === 1 && /^\d{1,2}$/.test(L.its[0].s) && L.its[0].x > 560)));
    }
    return { lines: all, pages: pdf.numPages };
  }
  const MONEY = /^-?(\d{1,3}(\.\d{3})*|\d+)(,\d{1,2})?,?$|^-$/;
  const num = s => { if (s == null) return null; s = String(s).trim(); if (s === "-" || s === "") return 0; s = s.replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."); if (s.endsWith(".")) s = s.slice(0, -1); const v = parseFloat(s); return isNaN(v) ? null : v; };
  const numDot = s => { const v = parseFloat(String(s).replace(/[^\d.\-]/g, "")); return isNaN(v) ? null : v; };
  const iso = d => { const m = String(d).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : null; };
  const per = s => { const m = String(s).match(/(\d{1,2})\/(\d{4})/); return m ? `${m[2]}-${m[1].padStart(2, "0")}` : null; };
  const isMoney = i => MONEY.test(i.s);
  const inX = (L, a, b) => L.its.filter(i => i.x >= a && i.x < b && i.s !== "$" && isMoney(i));
  const val = (L, a, b) => { const t = inX(L, a, b); return t.length ? num(t[t.length - 1].s) : null; };
  const txt = (L, maxX) => L.its.filter(i => i.x < maxX).map(i => i.s).join(" ").replace(/\s+/g, " ").trim();
  const joinSplit = its => { const o = []; for (let k = 0; k < its.length; k++) { const a = its[k], b = its[k + 1]; if (/,$/.test(a.s) && b && /^\d{1,2}$/.test(b.s)) { o.push({ ...a, s: a.s + b.s }); k++; } else o.push(a); } return o; };

  function parse(doc, filename) {
    const { lines, pages } = doc, R = { periodo: null, liquidacion: null, fecha_emision: null, fecha_vencimiento: null, recargo_vencimiento: null, fecha_cierre: null, paginas: pages, barrio_texto: null,
      total_gastos: null, gastos_extraordinarios: 0, fondo_reserva: null, rubros: [], gastos: [], pagos_periodos_anteriores: [], pagos_periodos_anteriores_total: null,
      fondos: {}, ingresos: [], egresos: [], banco: {}, composicion_saldo: {}, patrimonio: {}, gastos_pendientes: [], cobros_no_identificados: [], cobros_identificados: [],
      saldos_pendientes: [], saldos_pendientes_total: null, prorrateo: [], prorrateo_totales: null, cupon: { unidad: null }, recibos: [], dudas: [] };
    let mode = "header", rubro = null, item = null, pa = null, rec = null, pendSub = false;

      const g = { rubro, item: item.item, concepto_original: t, importe: item.total ?? 0, columna: item.ord != null ? "ORD" : (item.ext != null ? "EXT" : "ORD"), base_calculo: null, porcentaje: null, pagina: String(item.p) };
      let m = t.match(/TOTAL DE \$([\d.,]+) X ([\d,]+)%/) || t.match(/(?:80|20)%: \$([\d.,]+); PARTICIPACI[ÓO]N[^%]*? ([\d,]+)%/);
      if (m) { g.base_calculo = num(m[1]); g.porcentaje = +(num(m[2]) / 100).toFixed(6); }

    for (const L of lines) {

      if (U.includes("GASTOS DEL PERÍODO POR") || U.includes("GASTOS DEL PERIODO POR") || /^REMUNERACIONES AL PERSONAL$/.test(U)) { mode = "gastos"; continue; }
      if (/^\d{1,2}\.\s?[A-ZÁÉÍÓÚÑ]/.test(txt(L, 320)) && T.includes("Gastos Ord.")) { closeItem(); mode = "gastos"; rubro = txt(L, 320).replace(/^(\d{1,2}\.)\s*/, "$1 "); continue; }
      if (/^TOTAL DE GASTOS/.test(U)) { closeItem(); R.total_gastos = val(L, 490, 640); mode = "none"; continue; }

/* ---------- Evolución ---------- */
const METRICS = {
  lote: ["Expensa de un lote común", id => n(C.P(id).Expensa_Ord_Lote_Tipo)],
  gastos: ["Gastos del barrio", id => C.totalGastos(id)],
  seguridad: ["Seguridad", id => n(C.EV(id).Seguridad)],
  caja: ["Plata en la cuenta", id => n(C.EV(id).Saldo_Caja_Final)],
  deuda: ["Deuda de vecinos", id => n(C.EV(id).Deudas_A_Cobrar) + n(C.EV(id).Intereses_A_Cobrar)],
};
function evolucion() {
  let ids = ["lote", "gastos", "seguridad"].includes(metric) ? C.withSpend : C.ids;
  if (range !== "todo") ids = ids.slice(-(+range));
  const [name, f] = METRICS[metric], vals = ids.map(f), avg = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
  const first = vals[0], last = vals[vals.length - 1];
  after.push(() => barsChart("#ch-evo", ids.map(short), vals, name));
  return `<h1>¿Cómo viene?</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Cómo cambió cada número mes a mes. Elija qué ver y cuántos meses.</div>
  <div class="chips" role="group" aria-label="Qué ver">${Object.entries(METRICS).map(([k, [t]]) => `<button data-metric="${k}" class="${k === metric ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="chips" role="group" aria-label="Cuántos meses">${[["3", "3 meses"], ["6", "6 meses"], ["12", "12 meses"], ["todo", "Todo"]].map(([k, t]) => `<button data-range="${k}" class="${k === range ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="box"><div class="chart"><canvas id="ch-evo"></canvas></div>
  ${ids.length > 1 ? `<p>De ${label(ids[0])} a ${label(ids[ids.length - 1])}, <b>${esc(name.toLowerCase())}</b> ${last >= first ? "subió" : "bajó"} <b>${pct(Math.abs(C.varPct(last, first)), false)}</b>.</p>
  <p class="fine">Promedio: ${money(avg)} · Máximo: ${money(Math.max(...vals))} · Mínimo: ${money(Math.min(...vals))}.</p>` : ""}</div>
  <table class="tbl"><thead><tr><th>Mes</th><th class="r">Importe</th><th class="r">Cambio</th><th class="r">vs. promedio</th></tr></thead><tbody>
  ${ids.map((id, i) => `<tr><td>${labelCap(id)}</td><td class="r">${money(vals[i])}</td><td class="r">${i && vals[i - 1] ? pct(C.varPct(vals[i], vals[i - 1])) : "—"}</td><td class="r">${avg ? pct(vals[i] / avg - 1) : "—"}</td></tr>`).join("")}
  </tbody></table>
  <h2>Cada grupo de gastos, mes a mes</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Grupo</th>${C.withSpend.map(id => `<th class="r">${short(id)}</th>`).join("")}<th class="r">Promedio</th></tr></thead><tbody>
  ${[...new Set(DATA.sheets.GASTOS.map(g => g.Categoria))].map(cat => { const v = C.withSpend.map(id => C.G(id).filter(g => g.Categoria === cat).reduce((a, g) => a + n(g.Importe), 0)); const av = v.reduce((a, b) => a + b, 0) / v.length;
    return `<tr><td>${esc(Plain.cat(cat).nombre)}</td>${v.map((x, i) => `<td class="r${i && v[i - 1] && Math.abs(x / v[i - 1] - 1) > .2 ? " hl" : ""}">${money(x, 0)}</td>`).join("")}<td class="r">${money(av, 0)}</td></tr>`; }).join("")}
  </tbody></table></div><p class="fine">Resaltado en amarillo: cambió más de 20% contra el mes anterior. En esta tabla los importes están redondeados al peso.</p>${statsTable()}`;
}

/* ---------- Gastos ---------- */
function gastos() {

    const conc = C.breakdown(sel, "Concepto_Normalizado").filter(r => C.G(sel).concat(pv ? C.G(pv) : []).some(g => g.Concepto_Normalizado === r.key && g.Categoria === c.key));

const PAGO = { "PAGADO EN EL PERÍODO": "Pagado en el mes.", "PAGADO EN PERÍODO POSTERIOR": "Pagado en un mes siguiente.", "PENDIENTE (último período cargado)": "Todavía figura sin pagar.", "SIN PAGO IDENTIFICADO EN LIQUIDACIONES POSTERIORES": "No aparece pagado en los meses siguientes.", "SIN IMPORTE": "Sin importe." };

/* ---------- Proveedores ---------- */
function spark(vals) { const w = 96, h = 26, m = Math.max(...vals, 1); const pts = vals.map((v, i) => `${(i / Math.max(vals.length - 1, 1) * w).toFixed(1)},${(h - v / m * (h - 2) - 1).toFixed(1)}`).join(" "); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#1F5C46" stroke-width="2"/></svg>`; }
function proveedores() {
  const GB = DATA.sheets.GASTOS.filter(g => C.ids.includes(g.ID_Periodo)), tot = Core.sum(GB, "Importe");
  const rows = DATA.sheets.PROVEEDORES.filter(p => GB.some(g => g.ID_Proveedor === p.ID_Proveedor)).map(p => ({ ...p, vals: C.withSpend.map(id => C.G(id).filter(g => g.ID_Proveedor === p.ID_Proveedor).reduce((a, g) => a + n(g.Importe), 0)) })).sort((a, b) => b.vals.reduce((x, y) => x + y, 0) - a.vals.reduce((x, y) => x + y, 0));
  return `<h1>Proveedores</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Las empresas y personas que le cobran al barrio, de mayor a menor, sumando de ${label(C.withSpend[0])} a ${label(C.withSpend[C.withSpend.length - 1])} (${money(tot)} en total). La línea muestra cómo varió cada mes.</div>
  <ul class="list">${rows.map(p => `<li><div><b>${esc(p.Proveedor)}</b><span>${esc(Plain.cat(p.Categoria).nombre)} · ${p.vals.filter(v => v).length} meses · ${pct(p.vals.reduce((a, b) => a + b, 0) / tot, false)} del total</span></div>
    <div class="r">${spark(p.vals)}<b>${money(p.vals.reduce((a, b) => a + b, 0))}</b><span>Último mes ${money(p.vals[p.vals.length - 1])}</span></div></li>`).join("")}</ul>`;
}

}
function localPreview(liq, file) {
  const s = liq.gastos.reduce((a, g) => a + (+g.importe || 0), 0);
  return { periodo: liq.periodo, bloqueos: ["Vista previa: la planilla no está conectada, no se puede incorporar."], draftId: null,
    resumen: { "Barrio (texto del PDF)": liq.barrio_texto || "s/d", "Período": liq.periodo, "Archivo": file, "Total de gastos": liq.total_gastos, "Repartido entre lotes": (liq.prorrateo_totales || {}).gastos_ord, "Expensa lote común": (liq.cupon || {}).gastos_ord, "Cuenta al cierre": ((liq.fondos || {}).TOTAL || {}).saldo_final, "Ítems de gasto": String(liq.gastos.length), "Lotes": String(liq.prorrateo.length) },
    controles: [{ control: "Suma de ítems = TOTAL DE GASTOS", documento: liq.total_gastos, calculado: Math.round(s * 100) / 100, ok: Math.abs(s - liq.total_gastos) < 0.01 }],
    gastos: liq.gastos.map(g => ({ concepto_original: g.concepto_original, concepto_normalizado: g.rubro, categoria: "—", importe: g.importe })), observaciones: [], dudas: liq.dudas };
}
function preview(d) {
  const r = d.resumen || {}, bloq = d.bloqueos || [];
  return `<h2>Resultado: ${esc(d.barrioNombre || "")} — liquidación ${esc(d.periodo)}</h2>
  <table class="tbl"><tbody>${Object.entries(r).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${typeof v === "number" ? money(v) : esc(v)}</td></tr>`).join("")}</tbody></table>
  ${bloq.length ? `<article class="al lv-rojo"><h3>No se puede incorporar todavía</h3><ul>${bloq.map(b => `<li>${esc(b)}</li>`).join("")}</ul></article>` : ""}
  <h2>Controles (${d.controles.filter(c => c.ok).length} de ${d.controles.length} dan bien)</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Control</th><th class="r">Liquidación</th><th class="r">Calculado</th><th></th></tr></thead><tbody>
  ${d.controles.map(c => `<tr class="${c.ok ? "" : "flag"}"><td>${esc(c.control)}</td><td class="r">${money(c.documento)}</td><td class="r">${money(c.calculado)}</td><td>${c.ok ? "✓" : "✗"}</td></tr>`).join("")}</tbody></table></div>
  <h2>Gastos leídos (${d.gastos.length})</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Concepto</th><th>Grupo</th><th class="r">Importe</th></tr></thead><tbody>
  ${d.gastos.map(g => `<tr class="${g.sin_regla ? "flag" : ""}"><td>${esc(g.concepto_normalizado)}<small>${esc(String(g.concepto_original).slice(0, 90))}</small></td><td>${esc(g.categoria)}</td><td class="r">${money(g.importe)}</td></tr>`).join("")}</tbody></table></div>
  ${(d.observaciones || []).length ? `<h2>Observaciones que se van a registrar</h2><ul>${d.observaciones.map(o => `<li>${esc(o.importancia)} ${esc(o.dato)}: ${esc(o.problema)}</li>`).join("")}</ul>` : ""}
  ${(d.dudas || []).length ? `<h2>Datos que la lectura no pudo confirmar</h2><ul>${d.dudas.map(o => `<li>${esc(o.campo)}: ${esc(o.detalle)} (pág. ${esc(o.pagina)})</li>`).join("")}</ul>` : ""}
  ${d.draftId ? `<div class="actions">${bloq.length ? `<label class="chk"><input type="checkbox" id="force"> Incorporar igual y dejar todo marcado para revisar</label>` : ""}
  <button id="commit" class="btn">Incorporar a la base</button><button id="discard" class="btn ghost">Descartar</button></div>` : ""}`;
}
async function api(body) { const r = await fetch(CFG.API_URL, { method: "POST", body: JSON.stringify(body) }); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
function bindCargar() {
  if (!$("#go-pdf")) return;
  $("#go-pdf").onclick = async () => {
    const f = $("#pdf").files[0]; if (!f) return toast("Elija el PDF de la liquidación.");
    $("#busy").hidden = false; $("#go-pdf").disabled = true;
    try {
      const buf = new Uint8Array(await f.arrayBuffer()), lib = await loadPdfJs(), liq = await LiqParser.fromFile(lib, buf.slice());
      if (!liq.periodo || !liq.gastos.length) throw new Error("No se reconoció el formato de la liquidación. ¿Es el PDF original de AdminProp?");
      if (!CFG.API_URL) state.draft = localPreview(liq, f.name);
      else {
        state.token = $("#tok").value.trim(); sessionStorage.setItem("portal_token", state.token);
        let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        state.draft = (await api({ action: "preview", token: state.token, filename: f.name, json: JSON.stringify(liq), pdfBase64: btoa(bin) })).preview;
      }
      $("#prev").innerHTML = preview(state.draft); bindPreview();
    } catch (e) { toast(e.message); } finally { $("#busy").hidden = true; $("#go-pdf").disabled = false; }
  };
  if (state.draft) bindPreview();
}
function bindPreview() {
  const c = $("#commit"), d = $("#discard"); if (!c) return;
  c.onclick = async () => { c.disabled = true; try { const j = await api({ action: "commit", token: state.token, draftId: state.draft.draftId, force: !!($("#force") && $("#force").checked) }); toast(`Liquidación ${j.periodo} incorporada.`); state.draft = null; animated = {}; await load(); go("inicio"); } catch (e) { toast(e.message); c.disabled = false; } };
  d.onclick = () => { state.draft = null; render(); };
}

/* ---------- Gráficos ---------- */
const PAL = ["#1F5C46", "#E9A23B", "#3F7CB8", "#B8402F"];
const yTick = v => "$ " + (Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " M" : (v / 1e3).toLocaleString("es-AR", { maximumFractionDigits: 0 }) + " mil");
function opts(stacked) { return { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
  plugins: { legend: { labels: { font: { family: "Atkinson Hyperlegible", size: 13 }, boxWidth: 14 } }, tooltip: { bodyFont: { size: 14 }, callbacks: { label: c => ` ${c.dataset.label}: ${money(c.parsed.y)}` } } },
  scales: { y: { stacked, ticks: { callback: yTick, font: { size: 12 } }, grid: { color: "#E3EAE6" } }, x: { stacked, grid: { display: false }, ticks: { font: { size: 12 } } } } }; }
function barsChart(s, labels, data, name) { const el = $(s); if (!el) return; charts.push(new Chart(el, { type: "bar", data: { labels, datasets: [{ label: name, data, backgroundColor: data.map((_, i) => i === data.length - 1 ? "#1F5C46" : "#9CC3AE"), borderRadius: 6 }] }, options: { ...opts(false), plugins: { ...opts(false).plugins, legend: { display: false } } } })); }
function lines(s, labels, sets) { const el = $(s); if (!el) return; charts.push(new Chart(el, { type: "line", data: { labels, datasets: sets.map((d, i) => ({ ...d, borderColor: PAL[i], backgroundColor: PAL[i], borderWidth: 3, pointRadius: 4, tension: 0 })) }, options: opts(false) })); }
function stacked(s, labels, sets) { const el = $(s); if (!el) return; charts.push(new Chart(el, { type: "bar", data: { labels, datasets: sets.map((d, i) => ({ ...d, backgroundColor: PAL[i * 3] || PAL[i], borderRadius: 4 })) }, options: opts(true) })); }

let toastT; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 5000); }
document.addEventListener("DOMContentLoaded", () => {
  if (window.Chart) { Chart.defaults.animation.duration = 350; Chart.defaults.font.family = "Atkinson Hyperlegible, system-ui, sans-serif"; }
  const sz = store.get("portal_size") || "1"; document.documentElement.dataset.size = sz;
  $("#size").onclick = () => { const nx = String(((+document.documentElement.dataset.size || 1) % 3) + 1); document.documentElement.dataset.size = nx; store.set("portal_size", nx); toast(["Letra normal", "Letra grande", "Letra más grande"][nx - 1]); render(); };
  $("#periodo").onchange = e => { sel = e.target.value; catSel = 0; render(); };
  $("#barrioSel").onchange = e => { barrio = e.target.value; store.set("portal_barrio", barrio); C = Core.make(DATA, barrio); animated = {}; catSel = 0; fillPeriods(); render(); };
  document.title = "Expensas · Fideicomiso Bella Vista";
  load();
});
</script>
