<style>

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem}

main{max-width:720px;margin:0 auto;padding:1.1rem 1rem 7rem}
main.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.3}to{opacity:1}}
.intro{background:var(--sky-soft);border-radius:12px;padding:.75rem .9rem;font-size:.92rem;margin:.6rem 0 1rem}
.intro b{color:var(--sky)}
.muted{color:var(--muted)}.fine{color:var(--muted);font-size:.82rem}
/* inicio */
.hola{font-size:1.05rem;color:var(--muted);margin:.2rem 0 .8rem}
.hero{background:var(--card);border-radius:20px;padding:1.2rem 1.2rem 1rem;box-shadow:0 1px 2px rgba(30,43,39,.06),0 8px 24px rgba(30,43,39,.06)}
.hero .k{color:var(--muted);margin:0}
.hero .n{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:.25rem 0 .5rem;font-variant-numeric:tabular-nums}
.hero .n small{font-size:.42em;color:var(--muted);letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.3rem .75rem;font-weight:700;font-size:.92rem}
.chip.up{background:var(--sun-soft);color:var(--sun)}.chip.down{background:var(--ok-soft);color:var(--ok)}.chip.flat{background:var(--brand-soft);color:var(--brand)}
.spark{display:flex;align-items:flex-end;gap:6px;height:64px;margin:1rem 0 .3rem;padding:0;border:0;background:none;width:100%}
.spark span{flex:1;background:var(--brand-soft);border-radius:6px 6px 2px 2px;position:relative}
.spark span.cur{background:var(--brand)}
.spark-l{display:flex;gap:6px;font-size:.72rem;color:var(--muted)}.spark-l span{flex:1;text-align:center}
.venc{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line);font-size:.93rem}

.sema{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.15rem;border:0;border-radius:14px;padding:.85rem .9rem;background:var(--card);border-left:6px solid var(--line);min-height:6.2rem}
.tile .t{font-size:.86rem;color:var(--muted);display:flex;gap:.35rem;align-items:center}
.tile .d{font-weight:700;font-size:1.05rem;line-height:1.25}
.tile .e{font-size:.78rem;font-weight:700;margin-top:auto}
.tile.verde{border-left-color:var(--ok)}.tile.verde .e{color:var(--ok)}
.tile.amarillo{border-left-color:#E9A23B}.tile.amarillo .e{color:var(--sun)}
.tile.rojo{border-left-color:var(--red)}.tile.rojo .e{color:var(--red)}
.tile.gris{border-left-color:var(--line)}
.dona{display:grid;grid-template-columns:1fr;gap:1rem;background:var(--card);border-radius:16px;padding:1rem}

.dona-c{position:relative;height:220px}
.dona-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dona-mid b{font-size:1.6rem}.dona-mid span{font-size:.82rem;color:var(--muted);max-width:7.5rem}
.leg{list-style:none;margin:0;padding:0}
.leg button{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:.55rem .5rem}
.leg button[aria-pressed="true"]{background:var(--brand-soft)}
.leg i{width:14px;height:14px;border-radius:4px}
.leg b{font-variant-numeric:tabular-nums}
.catinfo{background:var(--bg);border-radius:12px;padding:.75rem .9rem;margin-top:.4rem;font-size:.93rem}

.imp{background:var(--card);border-radius:14px;padding:1rem;margin:.7rem 0;border-left:6px solid var(--line)}
.imp.rojo{border-left-color:var(--red)}.imp.naranja{border-left-color:#D9822B}
.imp h3{margin:.1rem 0 .35rem}.imp .q{font-size:.93rem}
.imp details{margin-top:.5rem}.imp summary{color:var(--sky);font-weight:700;cursor:pointer;padding:.2rem 0}
.imp details p{font-size:.9rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:.75rem 1.1rem;font-weight:700;margin:.3rem .4rem .3rem 0;min-height:48px}
.btn.ghost{background:none;color:var(--brand);border:2px solid var(--brand)}.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:.3rem 0;color:var(--sky);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.box{background:var(--card);border-radius:16px;padding:1rem;margin:.7rem 0}
.chart{position:relative;height:250px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;margin:.4rem 0}
.tbl th{font-weight:700;color:var(--muted);text-align:left;border-bottom:2px solid var(--line);padding:.45rem .35rem}
.tbl td{border-bottom:1px solid var(--line);padding:.55rem .35rem;vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.flag td{background:var(--sun-soft)}.tbl td.hl{background:var(--sun-soft)}.tbl tr.tot td{font-weight:700}
.tbl small{display:block}
.scroll{overflow-x:auto}
.pos{color:var(--ok)}
.cats{list-style:none;padding:0;margin:.6rem 0}
.cats>li{background:var(--card);border-radius:14px;margin:.6rem 0;overflow:hidden}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .7rem;align-items:center;width:100%;text-align:left;background:none;border:0;padding:.9rem}

.c{border-top:1px solid var(--line);padding:.6rem 0}.c-h{display:flex;justify-content:space-between;gap:1rem}.c-h span{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}

 body{display:grid;grid-template-columns:240px 1fr}

 .mas{display:none!important}
 main{padding:1.8rem 2rem 4rem;margin:0}.foot{margin:0;padding:0 2rem 2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>/* ===== Núcleo de cálculo (sin DOM) ===== */
const Core = (() => {
  const MES = ["", "enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const n = v => (typeof v === "number" ? v : (v === "" || v == null || isNaN(+v) ? 0 : +v));
  const money = (v, dec = 2) => (v < 0 ? "−" : "") + "$\u00a0" + Math.abs(n(v)).toLocaleString("es-AR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const pct = (v, sign = true) => v === "" || v == null || !isFinite(v) ? "s/d" : (sign && v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  const label = id => { const [y, m] = String(id).split("-"); return `${MES[+m]} ${y}`; };
  const labelCap = id => { const s = label(id); return s.charAt(0).toUpperCase() + s.slice(1); };
  const short = id => { const [y, m] = String(id).split("-"); return `${MES[+m].slice(0,3)} ${y.slice(2)}`; };
  const sum = (rows, f) => rows.reduce((a, r) => a + n(typeof f === "function" ? f(r) : r[f]), 0);
  const groupSum = (rows, key, val = "Importe") => { const m = new Map(); rows.forEach(r => m.set(r[key], (m.get(r[key]) || 0) + n(r[val]))); return m; };
  const U = { amarillo: .20, naranja: .30, rojo: .50, extremo: 1.0 };

  function make(data) {
    const S = data.sheets;
    const periods = [...S.PERIODOS].sort((a, b) => n(a.Periodo_Num) - n(b.Periodo_Num));
    const ids = periods.map(p => p.ID_Periodo);
    const P = id => periods.find(p => p.ID_Periodo === id);
    const withSpend = periods.filter(p => n(p.Total_Gastos_Periodo) > 1).map(p => p.ID_Periodo);
    const prevOf = id => { const i = withSpend.indexOf(id); if (i > 0) return withSpend[i - 1]; const before = withSpend.filter(x => x < id); return before.length ? before[before.length - 1] : null; };
    const G = id => S.GASTOS.filter(g => g.ID_Periodo === id);
    const EV = id => S.EVOLUCION.find(e => e.ID_Periodo === id) || {};
    const fondo = (id, f) => S.FONDOS.find(x => x.ID_Periodo === id && x.Fondo === f) || {};
    const totalGastos = id => sum(G(id), "Importe");
    const varPct = (a, b) => (b ? a / b - 1 : null);
    const nivel = v => { if (v == null) return null; const a = Math.abs(v); return a > U.extremo ? "rojo" : a > U.rojo ? "rojo" : a > U.naranja ? "naranja" : a > U.amarillo ? "amarillo" : "verde"; };

    function breakdown(id, key) {
      const cur = groupSum(G(id), key), pv = prevOf(id), prev = pv ? groupSum(G(pv), key) : new Map();
      const keys = new Set([...cur.keys(), ...prev.keys()]); const tot = totalGastos(id);
      return [...keys].map(k => { const a = cur.get(k) || 0, b = prev.get(k) || 0; return { key: k, actual: a, anterior: b, dif: a - b, var: varPct(a, b), share: tot ? a / tot : 0 }; })
        .filter(r => r.actual || r.anterior).sort((x, y) => y.actual - x.actual || y.anterior - x.anterior);
    }
    function series(key, value) { return ids.map(id => ({ id, v: groupSum(G(id), key).get(value) || 0 })); }

    function signals(id) {
      const out = []; const pv = prevOf(id); const p = P(id) || {}; const tg = totalGastos(id);
      const base = n(p.Base_Prorrateo_Ord);
      if (tg > 1 && Math.abs(base - tg) > 1000) out.push({ nivel: "rojo", titulo: "Se prorrateó más de lo que se gastó",
        texto: `Entre las unidades se repartieron ${money(base)}, pero el total de gastos del mes es ${money(tg)}: una diferencia de ${money(base - tg)} (${pct(base / tg - 1)}). La liquidación no explica la diferencia.`, tipo: "Cálculo" });
      const sd = S.EGRESOS_CAJA.filter(e => e.ID_Periodo === id && e.Tipo_Egreso === "EGRESO SIN DETALLE DE COMPROBANTE");

  const MONEY = /^-?(\d{1,3}(\.\d{3})*|\d+)(,\d{1,2})?,?$|^-$/;

  document.querySelectorAll("[data-range]").forEach(el => el.onclick = () => { range = el.dataset.range; render(); });
  document.querySelectorAll("[data-metric]").forEach(el => el.onclick = () => { metric = el.dataset.metric; render(); });
  document.querySelectorAll("[data-af]").forEach(el => el.onclick = () => { alertFilter = el.dataset.af; render(); });
  document.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => go(el.dataset.goto));
  document.querySelectorAll("[data-sema]").forEach(el => el.onclick = () => semaSheet(el.dataset.sema));
  document.querySelectorAll("[data-term]").forEach(el => el.onclick = () => termSheet(el.dataset.term));
  if (view === "cargar") bindCargar();
  if (view === "milote") bindMiLote();
}
function sheet(html) {
  const s = $("#sheet"); s.innerHTML = `<div class="sheet-bg"></div><div class="sheet" role="dialog" aria-modal="true"><button class="x" aria-label="Cerrar">×</button>${html}</div>`;
  const close = () => s.innerHTML = ""; s.querySelector(".x").onclick = close; s.querySelector(".sheet-bg").onclick = close; s.querySelector(".x").focus();
  s.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => { close(); go(el.dataset.goto); });
  document.onkeydown = e => { if (e.key === "Escape") close(); };
}
const term = (t, txt) => `<button class="link" data-term="${esc(t)}">${esc(txt || t)}</button>`;
function termSheet(t) { const g = Plain.GLOSARIO.find(x => x[0] === t); sheet(`<h2>${esc(t)}</h2><p>${esc(g ? g[1] : "")}</p><button class="link" data-goto="diccionario">Ver el diccionario completo</button>`); }
function semaSheet(k) {
  const s = C.semaforo(sel).find(x => x.k === k), dest = { expensa: "evolucion", caja: "caja", deuda: "cobranza", revisar: "asamblea" }[k];
  sheet(`<h2>${esc(s.titulo)}: ${esc(s.dato)}</h2><p><b>${ESTADO[s.estado]}.</b></p><p>${esc(s.como)}</p><p class="fine">Es un indicador para orientarse, no una conclusión.</p><button class="btn" data-goto="${dest}">Ver el detalle</button>`);
}

/* ---------- Inicio ---------- */
function inicio() {
  const p = C.P(sel), pv = C.prevOf(sel), tg = C.totalGastos(sel);
  if (tg <= 1) return `<h1>Resumen de ${label(sel)}</h1><div class="intro">${esc(C.narrative(sel)[0])} Elija otro mes arriba.</div>`;
  const lt = n(p.Expensa_Ord_Lote_Tipo), ltp = pv ? n(C.P(pv).Expensa_Ord_Lote_Tipo) : 0, dif = lt - ltp, v = pv ? lt / ltp - 1 : null;
  const hist = C.withSpend.filter(id => id <= sel).slice(-6), mx = Math.max(...hist.map(id => n(C.P(id).Expensa_Ord_Lote_Tipo)));
  const rec = typeof p.Recargo_Vencimiento === "number" ? p.Recargo_Vencimiento : null, venc = p.Fecha_Vencimiento, pasado = venc && new Date(venc + "T23:59:59") < new Date();
  const cats = C.breakdown(sel, "Categoria").filter(c => c.actual > 0); if (catSel >= cats.length) catSel = 0;
  const qs = C.questions(sel);
  const fromV = pv ? ltp : 0;
  if (!animated[sel]) after.push(() => countUp("#heroN", fromV, lt)), animated[sel] = true;
  after.push(() => donut(cats));
  return `
  <h1>Resumen de ${label(sel)}</h1>
  <p class="hola">Lo importante de la liquidación del mes, explicado en simple.</p>
  <section class="hero" aria-label="Expensa del mes">
    <p class="k">Este mes, un ${term("Lote común", "lote común")} paga</p>
    <p class="n" id="heroN">${moneyBig(lt)}</p>
    ${pv ? `<span class="chip ${dif > 0.5 ? "up" : dif < -0.5 ? "down" : "flat"}">${dif > 0.5 ? "▲" : dif < -0.5 ? "▼" : "="} ${money(Math.abs(dif))} ${dif >= 0 ? "más" : "menos"} que en ${MESES_TXT(pv)} (${pct(v)})</span>` : ""}
    <button class="spark" data-goto="evolucion" aria-label="Ver la evolución de la expensa">${hist.map(id => `<span class="${id === sel ? "cur" : ""}" style="height:${Math.max(8, n(C.P(id).Expensa_Ord_Lote_Tipo) / mx * 100)}%" title="${labelCap(id)}: ${money(n(C.P(id).Expensa_Ord_Lote_Tipo))}"></span>`).join("")}</button>
    <div class="spark-l">${hist.map(id => `<span>${short(id).split(" ")[0]}</span>`).join("")}</div>
    ${venc ? `<div class="venc">${ico("calendar")}<p style="margin:0">${pasado ? "Venció" : "Vence"} el <b>${fechaLarga(venc)}</b>.${rec ? ` Pagando después, se suma un ${term("Vencimiento y recargo", pct(rec, false) + " de recargo")} (en un lote común, ${money(Math.ceil((lt + 0.08) * rec), 0)}).` : ""}</p></div>` : ""}
  </section>

  <h2>El mes de un vistazo</h2>
  <p class="fine">Toque cada cuadro para ver qué significa.</p>
  <div class="sema">${C.semaforo(sel).map(s => `<button class="tile ${s.estado}" data-sema="${s.k}"><span class="t">${s.titulo}</span><span class="d">${esc(s.dato)}</span><span class="e">● ${ESTADO[s.estado]}</span></button>`).join("")}</div>

  <h2>¿En qué se usa la plata?</h2>
  <p class="fine">El barrio gastó ${money(tg)} en el mes. Toque una parte del gráfico o de la lista.</p>
  <div class="dona">
    <div class="dona-c"><canvas id="ch-dona" aria-label="Gráfico de gastos por grupo"></canvas><div class="dona-mid" id="dona-mid"></div></div>
    <div><ul class="leg">${cats.map((c, i) => `<li><button data-ci="${i}" aria-pressed="${i === catSel}"><i style="background:${Plain.cat(c.key).color}"></i><span>${esc(Plain.cat(c.key).nombre)}</span><b>${pct(c.share, false)}</b></button></li>`).join("")}</ul>
    <div class="catinfo" id="catinfo"></div></div>
  </div>

  ${qs.length ? `<h2>Lo más importante para revisar</h2>
  <p class="fine">Son puntos para preguntar, no acusaciones.</p>
  ${qs.slice(0, 3).map(q => `<article class="imp ${q.nivel}"><h3>${esc(q.q)}</h3><p class="q">${esc(Plain.explicar(q.q, q.d) || q.d)}</p>
    <details><summary>Ver el detalle</summary><p>${esc(q.d)}</p></details></article>`).join("")}
  <button class="btn" data-goto="asamblea">${ico("chat")} Ver las ${qs.length} consultas para la administración</button>` : ""}

  <h2>Lo que pasó en el mes</h2>
  <ul>${C.narrative(sel).map(t => `<li style="margin:.5rem 0">${esc(t)}</li>`).join("")}</ul>

  <h2>Preguntas frecuentes</h2>
  <div class="box">${C.faq(sel).map(([q, a], i) => `<details${i ? "" : " open"}><summary style="font-size:1rem">${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>
  <p class="fine">¿Alguna palabra no se entiende? ${term("Expensas", "Abra el diccionario")} o búsquela en Más → Diccionario.</p>`;
}
const MESES_TXT = id => label(id).split(" ")[0];
function countUp(selr, from, to) {
  const el = $(selr); if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), d = 900;
  const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.innerHTML = moneyBig(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); else el.innerHTML = moneyBig(to); };
  requestAnimationFrame(step);
}
function donut(cats) {
  const el = $("#ch-dona"); if (!el) return;
  const lt = n(C.P(sel).Expensa_Ord_Lote_Tipo), pv = C.prevOf(sel);
  const show = i => {
    catSel = i; const c = cats[i], info = Plain.cat(c.key);
    $("#dona-mid").innerHTML = `<b>${pct(c.share, false)}</b><span>${esc(info.nombre)}</span>`;
    $("#catinfo").innerHTML = `<b>${esc(info.nombre)}</b><p style="margin:.3rem 0">${esc(info.txt)}</p>
      <p style="margin:.3rem 0">De la expensa de un lote común: <b style="display:inline">${money(C.perLote(sel, c.actual))}</b>. Total del barrio: ${money(c.actual)}.</p>
      ${pv ? `<p class="fine" style="margin:0">${c.anterior ? `En ${MESES_TXT(pv)} fue ${money(c.anterior)} (${pct(c.var)}).` : `En ${MESES_TXT(pv)} no hubo gastos de este grupo.`}</p>` : ""}`;
    document.querySelectorAll("[data-ci]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.ci === i));
    ch.data.datasets[0].offset = cats.map((_, k) => k === i ? 10 : 0); ch.update();
  };
  const ch = new Chart(el, { type: "doughnut", data: { labels: cats.map(c => Plain.cat(c.key).nombre), datasets: [{ data: cats.map(c => c.actual), backgroundColor: cats.map(c => Plain.cat(c.key).color), borderColor: "#fff", borderWidth: 2, hoverOffset: 8 }] },
    options: { cutout: "66%", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${money(c.parsed)}` } } }, onClick: (e, els) => { if (els.length) show(els[0].index); } } });
  charts.push(ch);
  document.querySelectorAll("[data-ci]").forEach(b => b.onclick = () => show(+b.dataset.ci));
  show(catSel);
}

/* ---------- Mi lote ---------- */
function milote() {
  const p = C.P(sel), coefSaved = store.get("portal_coef") || "5.67";
  return `<h1>Mi lote</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Cuánto paga su lote en ${label(sel)} y en qué se usa esa plata. Si su lote no es un lote común, escriba su porcentaje: figura en la liquidación, en la columna "%" al lado de su número de lote.</div>
  <label class="fld">Porcentaje de su lote (coeficiente)<input id="coef" inputmode="decimal" value="${esc(coefSaved)}"></label>
  <div id="milote-res"></div>`;
}
function bindMiLote() {
  const upd = () => {
    const raw = $("#coef").value.replace(",", "."), c = parseFloat(raw); store.set("portal_coef", $("#coef").value);
    const p = C.P(sel), base = n(p.Base_Prorrateo_Ord), lt = n(p.Expensa_Ord_Lote_Tipo), comun = Math.abs(c - 5.67) < 0.001;
    if (!(c > 0 && c < 100)) { $("#milote-res").innerHTML = `<p class="empty">Escriba un porcentaje válido, por ejemplo 5,67.</p>`; return; }
    const exp = comun ? lt : base * c / 100, cats = C.breakdown(sel, "Categoria").filter(x => x.actual > 0), rec = typeof p.Recargo_Vencimiento === "number" ? p.Recargo_Vencimiento : null;
    $("#milote-res").innerHTML = `<section class="hero"><p class="k">En ${label(sel)} su expensa ordinaria ${comun ? "es" : "es aproximadamente"}</p><p class="n">${moneyBig(exp)}</p>
      ${comun ? "" : `<p class="fine">Cálculo aproximado: total repartido entre los lotes (${money(base)}) × ${c.toLocaleString("es-AR")}%. El importe exacto está en su cupón.</p>`}
      ${p.Fecha_Vencimiento ? `<div class="venc">${ico("calendar")}<p style="margin:0">Vencimiento: <b>${fechaLarga(p.Fecha_Vencimiento)}</b>.${rec ? ` Después se suma ${pct(rec, false)}: unos ${money(Math.ceil(exp * rec), 0)}.` : ""} No incluye deudas anteriores ni gastos particulares.</p></div>` : ""}</section>
      <h2>En qué se usa su expensa</h2>
      <div class="box">${cats.map(x => `<div style="margin:.6rem 0"><div style="display:flex;justify-content:space-between;gap:1rem"><span>${esc(Plain.cat(x.key).nombre)}</span><b>${money(x.share * exp)}</b></div>
        <div class="cat" style="padding:0;display:block"><div class="bar" style="margin-top:.3rem"><span style="width:${(x.share * 100).toFixed(1)}%;background:${Plain.cat(x.key).color}"></span></div></div></div>`).join("")}</div>
      <h2>Cómo viene un lote común</h2>
      <table class="tbl"><thead><tr><th>Mes</th><th class="r">Expensa</th><th class="r">Cambio</th></tr></thead><tbody>
      ${C.withSpend.map((id, i) => { const a = n(C.P(id).Expensa_Ord_Lote_Tipo), b = i ? n(C.P(C.withSpend[i - 1]).Expensa_Ord_Lote_Tipo) : 0; return `<tr><td>${labelCap(id)}</td><td class="r">${money(a)}</td><td class="r">${i ? pct(a / b - 1) : "—"}</td></tr>`; }).join("")}</tbody></table>`;
  };
  $("#coef").oninput = upd; upd();
}

/* ---------- Evolución ---------- */
const METRICS = {
  lote: ["Expensa de un lote común", id => n(C.P(id).Expensa_Ord_Lote_Tipo)],
  gastos: ["Gastos del barrio", id => C.totalGastos(id)],
  seguridad: ["Seguridad", id => n(C.EV(id).Seguridad)],
  caja: ["Plata en la cuenta", id => n(C.EV(id).Saldo_Caja_Final)],
  deuda: ["Deuda de vecinos", id => n(C.EV(id).Deudas_A_Cobrar) + n(C.EV(id).Intereses_A_Cobrar)],
};
function evolucion() {
  let ids = ["lote", "gastos", "seguridad"].includes(metric) ? C.withSpend : C.ids;
  if (range !== "todo") ids = ids.slice(-(+range));
  const [name, f] = METRICS[metric], vals = ids.map(f), avg = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
  const first = vals[0], last = vals[vals.length - 1];
  after.push(() => barsChart("#ch-evo", ids.map(short), vals, name));
  return `<h1>¿Cómo viene?</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Cómo cambió cada número mes a mes. Elija qué ver y cuántos meses.</div>
  <div class="chips" role="group" aria-label="Qué ver">${Object.entries(METRICS).map(([k, [t]]) => `<button data-metric="${k}" class="${k === metric ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="chips" role="group" aria-label="Cuántos meses">${[["3", "3 meses"], ["6", "6 meses"], ["12", "12 meses"], ["todo", "Todo"]].map(([k, t]) => `<button data-range="${k}" class="${k === range ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="box"><div class="chart"><canvas id="ch-evo"></canvas></div>
  ${ids.length > 1 ? `<p>De ${label(ids[0])} a ${label(ids[ids.length - 1])}, <b>${esc(name.toLowerCase())}</b> ${last >= first ? "subió" : "bajó"} <b>${pct(Math.abs(C.varPct(last, first)), false)}</b>.</p>
  <p class="fine">Promedio: ${money(avg)} · Máximo: ${money(Math.max(...vals))} · Mínimo: ${money(Math.min(...vals))}.</p>` : ""}</div>
  <table class="tbl"><thead><tr><th>Mes</th><th class="r">Importe</th><th class="r">Cambio</th><th class="r">vs. promedio</th></tr></thead><tbody>
  ${ids.map((id, i) => `<tr><td>${labelCap(id)}</td><td class="r">${money(vals[i])}</td><td class="r">${i && vals[i - 1] ? pct(C.varPct(vals[i], vals[i - 1])) : "—"}</td><td class="r">${avg ? pct(vals[i] / avg - 1) : "—"}</td></tr>`).join("")}
  </tbody></table>
  <h2>Cada grupo de gastos, mes a mes</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Grupo</th>${C.withSpend.map(id => `<th class="r">${short(id)}</th>`).join("")}<th class="r">Promedio</th></tr></thead><tbody>
  ${[...new Set(DATA.sheets.GASTOS.map(g => g.Categoria))].map(cat => { const v = C.withSpend.map(id => C.G(id).filter(g => g.Categoria === cat).reduce((a, g) => a + n(g.Importe), 0)); const av = v.reduce((a, b) => a + b, 0) / v.length;
    return `<tr><td>${esc(Plain.cat(cat).nombre)}</td>${v.map((x, i) => `<td class="r${i && v[i - 1] && Math.abs(x / v[i - 1] - 1) > .2 ? " hl" : ""}">${money(x, 0)}</td>`).join("")}<td class="r">${money(av, 0)}</td></tr>`; }).join("")}
  </tbody></table></div><p class="fine">Resaltado en amarillo: cambió más de 20% contra el mes anterior. En esta tabla los importes están redondeados al peso.</p>`;
}

/* ---------- Gastos ---------- */
function gastos() {
  const pv = C.prevOf(sel), cats = C.breakdown(sel, "Categoria"), max = Math.max(...cats.map(c => c.actual), 1), tg = C.totalGastos(sel);
  return `<h1>¿En qué se gastó en ${label(sel)}?</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Todo lo que se gastó en el mes, agrupado. Toque un grupo para ver cada factura, con el texto tal cual figura en la liquidación.</div>
  <p class="big">${money(tg)}</p><p class="muted">en total${pv ? `, ${pct(C.varPct(tg, C.totalGastos(pv)))} comparado con ${label(pv)}` : ""}.</p>
  <ul class="cats">${cats.map((c, i) => { const info = Plain.cat(c.key);
    const conc = C.breakdown(sel, "Concepto_Normalizado").filter(r => C.G(sel).concat(pv ? C.G(pv) : []).some(g => g.Concepto_Normalizado === r.key && g.Categoria === c.key));

      <span class="nm">${esc(info.nombre)}</span><span class="am">${money(c.actual)}</span>
      <span class="bar"><span style="width:${(c.actual / max * 100).toFixed(1)}%;background:${info.color}"></span></span>
      <span class="mt">${pct(c.share, false)} del total · en un lote común ≈ ${money(C.perLote(sel, c.actual))} · ${c.anterior ? `${pct(c.var)} contra ${short(pv)}` : c.actual ? "nuevo este mes" : "no se cobró este mes"}</span></button>
      <div id="cat${i}" class="conc" hidden><p class="what">${esc(info.txt)}</p>${conc.map(r => concepto(r)).join("")}</div></li>`; }).join("")}</ul>`;
}
const PAGO = { "PAGADO EN EL PERÍODO": "Pagado en el mes.", "PAGADO EN PERÍODO POSTERIOR": "Pagado en un mes siguiente.", "PENDIENTE (último período cargado)": "Todavía figura sin pagar.", "SIN PAGO IDENTIFICADO EN LIQUIDACIONES POSTERIORES": "No aparece pagado en los meses siguientes.", "SIN IMPORTE": "Sin importe." };
function concepto(r) {
  const items = C.G(sel).filter(g => g.Concepto_Normalizado === r.key);

    <p class="c-m">${r.anterior ? `Mes anterior ${money(r.anterior)} · ${pct(r.var)}` : r.actual ? "Nuevo este mes" : "No se cobró este mes"}</p>

/* ---------- Para revisar ---------- */
function alertas() {
  const sig = C.signals(sel), cc = C.ccOf(sel).map(c => ({ nivel: ccNivel(c.Importancia), titulo: c.Dato, texto: c.Problema, extra: c.Observacion, tipo: c.Tipo_Informacion }));
  const val = C.validations(sel), f = x => alertFilter === "todos" || x.nivel === alertFilter;
  const card = x => { const pl = Plain.explicar(x.titulo, x.texto); return `<article class="al ${NIV[x.nivel][1]}"><p class="al-n">${NIV[x.nivel][0]}</p><h3>${esc(x.titulo)}</h3>${pl ? `<p><b>En simple:</b> ${esc(pl)}</p>` : ""}<p>${esc(x.texto)}</p>${x.extra ? `<p class="al-x">${esc(x.extra)}</p>` : ""}</article>`; };
  return `<h1>Para revisar en ${label(sel)}</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Lo que la app encontró al revisar la liquidación. Son puntos para preguntar, no conclusiones: que algo cambie no quiere decir que esté mal.</div>
  <div class="chips">${[["todos", "Todos"], ["rojo", "Importante"], ["naranja", "Para revisar"], ["amarillo", "A tener en cuenta"], ["info", "Cambios"]].map(([k, t]) => `<button data-af="${k}" class="${k === alertFilter ? "on" : ""}">${t}</button>`).join("")}</div>

}

/* ---------- Consultas ---------- */
function asamblea() {
  const qs = C.questions(sel), txt = `Consultas sobre la liquidación de ${label(sel)} (${CFG.BARRIO}):\n\n` + qs.map((x, i) => `${i + 1}. ${x.q}: ${x.d}`).join("\n\n");
  setTimeout(() => { const b = $("#copy"); if (b) b.onclick = () => navigator.clipboard.writeText(txt).then(() => toast("Listo: las consultas quedaron copiadas. Péguelas en un mail o en WhatsApp.")).catch(() => toast("No se pudo copiar. Seleccione el texto a mano.")); }, 0);
  return `<h1>Consultas a la administración</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Los puntos de ${label(sel)} que conviene pedir que expliquen. Están escritos como preguntas, con respeto. Con el botón se copian para mandarlos por mail o WhatsApp.</div>
  ${qs.length ? `<ol class="qs">${qs.map(x => `<li><b>${esc(x.q)}</b>${Plain.explicar(x.q, x.d) ? `<p><b>En simple:</b> ${esc(Plain.explicar(x.q, x.d))}</p>` : ""}<p>${esc(x.d)}</p></li>`).join("")}</ol><button id="copy" class="btn">${ico("copy")} Copiar las consultas</button>` : `<p class="empty">Este mes no hay puntos importantes para consultar.</p>`}`;
}

/* ---------- Proveedores ---------- */
function spark(vals) { const w = 96, h = 26, m = Math.max(...vals, 1); const pts = vals.map((v, i) => `${(i / Math.max(vals.length - 1, 1) * w).toFixed(1)},${(h - v / m * (h - 2) - 1).toFixed(1)}`).join(" "); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#1F5C46" stroke-width="2"/></svg>`; }
function proveedores() {
  const tot = Core.sum(DATA.sheets.GASTOS, "Importe");
  const rows = DATA.sheets.PROVEEDORES.map(p => ({ ...p, vals: C.withSpend.map(id => C.G(id).filter(g => g.ID_Proveedor === p.ID_Proveedor).reduce((a, g) => a + n(g.Importe), 0)) })).sort((a, b) => n(b.Total_Facturado) - n(a.Total_Facturado));
  return `<h1>Proveedores</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Las empresas y personas que le cobran al barrio, de mayor a menor, sumando de ${label(C.withSpend[0])} a ${label(C.withSpend[C.withSpend.length - 1])} (${money(tot)} en total). La línea muestra cómo varió cada mes.</div>
  <ul class="list">${rows.map(p => `<li><div><b>${esc(p.Proveedor)}</b><span>${esc(Plain.cat(p.Categoria).nombre)} · ${n(p.Cantidad_Periodos)} ${n(p.Cantidad_Periodos) === 1 ? "mes" : "meses"} · ${pct(n(p.Participacion_Total), false)} del total</span></div>
    <div class="r">${spark(p.vals)}<b>${money(p.Total_Facturado)}</b><span>Último mes ${money(p.Ultimo_Importe)}${typeof p.Variacion === "number" ? ` (${pct(p.Variacion)})` : ""}</span></div></li>`).join("")}</ul>`;
}

/* ---------- La plata del barrio ---------- */
function caja() {
  const ids = C.ids, mov = DATA.sheets.EGRESOS_CAJA.filter(e => e.ID_Periodo === sel), ing = DATA.sheets.INGRESOS.filter(e => e.ID_Periodo === sel), unpaid = C.unpaidHistoric();
  after.push(() => lines("#ch-caja", ids.map(short), [{ label: "Total en la cuenta", data: ids.map(id => n(C.EV(id).Saldo_Caja_Final)) }, { label: "Para gastos habituales", data: ids.map(id => n(C.EV(id).Fondo_Ord_Final)) }, { label: "Extraordinario", data: ids.map(id => n(C.EV(id).Fondo_Ext_Final)) }]));
  const tipoTxt = { "PAGO DE GASTOS LIQUIDADOS": "Pagos de gastos detallados en la liquidación", "RECLASIFICACIÓN DE COBROS": "Movimiento contable: no es plata que salió", "EGRESO SIN DETALLE DE COMPROBANTE": "Salió sin comprobante detallado", "AJUSTE": "Ajuste sin explicación" };
  return `<h1>La plata del barrio</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Cuánta plata tiene el barrio en el banco al cierre de cada mes, cuánto entró y cuánto salió. La liquidación no informa un ${term("Fondo de reserva", "fondo de reserva")}.</div>
  <div class="box"><div class="chart"><canvas id="ch-caja"></canvas></div></div>
  <h2>Movimientos de ${label(sel)}</h2>
  <table class="tbl"><tbody>
   <tr class="tot"><td>Había al empezar el mes</td><td class="r">${money(C.fondo(sel, "TOTAL").Saldo_Inicial)}</td></tr>
   ${ing.map(e => `<tr><td>Entró: ${esc(e.Concepto)}${e.Fondo === "EXTRAORDINARIO" ? " <small>(extraordinario)</small>" : ""}</td><td class="r pos">${money(e.Importe)}</td></tr>`).join("")}
   ${mov.map(e => `<tr class="${e.Tipo_Egreso === "EGRESO SIN DETALLE DE COMPROBANTE" ? "flag" : ""}"><td>Salió: ${esc(e.Concepto)}<small>${esc(tipoTxt[e.Tipo_Egreso] || "")}</small></td><td class="r">${money(e.Importe)}</td></tr>`).join("")}
   <tr class="tot"><td>Quedó al cierre</td><td class="r">${money(C.fondo(sel, "TOTAL").Saldo_Final_Documento)}</td></tr></tbody></table>
  <h2>Gastos que no aparecen pagados</h2>
  <p>Se cobraron a los vecinos pero no aparecen pagados en las liquidaciones siguientes: <b>${money(Core.sum(unpaid, "Importe"))}</b>. Puede que se hayan pagado con los pagos sin detalle; la información disponible no permite confirmarlo.</p>
  <div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th>Gasto</th><th class="r">Importe</th></tr></thead><tbody>${unpaid.map(g => `<tr><td>${short(g.ID_Periodo)}</td><td>${esc(g.Concepto_Normalizado)}</td><td class="r">${money(g.Importe)}</td></tr>`).join("")}</tbody></table></div>
  <h2>${term("Patrimonio neto", "Patrimonio neto")} según la liquidación</h2>
  <table class="tbl"><tbody>${ids.map(id => `<tr><td>${labelCap(id)}</td><td class="r">${money(C.EV(id).Patrimonio_Neto)}</td></tr>`).join("")}</tbody></table>`;
}

/* ---------- Vecinos que deben ---------- */
function cobranza() {
  const ids = C.ids;
  after.push(() => stacked("#ch-cob", ids.map(short), [{ label: "Deuda", data: ids.map(id => n(C.EV(id).Deudas_A_Cobrar)) }, { label: "Intereses", data: ids.map(id => n(C.EV(id).Intereses_A_Cobrar)) }]));
  return `<h1>Vecinos que deben</h1>
  <div class="intro"><b>¿Qué estoy viendo?</b> Lo que los lotes le deben al barrio, en total. No se muestran nombres ni lotes: esa información es privada.</div>
  <div class="box"><div class="chart"><canvas id="ch-cob"></canvas></div></div>
  <table class="tbl"><thead><tr><th>Mes</th><th class="r">Lotes que deben</th><th class="r">Deuda más intereses</th></tr></thead><tbody>
  ${ids.map(id => `<tr><td>${labelCap(id)}</td><td class="r">${n(C.EV(id).Unidades_Con_Deuda)} de ${n(C.P(id).Cantidad_Unidades)}</td><td class="r">${money(n(C.EV(id).Deudas_A_Cobrar) + n(C.EV(id).Intereses_A_Cobrar))}</td></tr>`).join("")}</tbody></table>
  <p class="fine">¿Por qué importa? Cuando hay vecinos que no pagan, el barrio tiene menos plata para cubrir los gastos del mes.</p>`;
}

/* ---------- Diccionario, documentos, histórico ---------- */
function diccionario() { return `<h1>Diccionario</h1><div class="intro"><b>¿Qué estoy viendo?</b> Las palabras que aparecen en las liquidaciones, explicadas en simple.</div><dl class="glos box">${Plain.GLOSARIO.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>`; }
function documentos() {
  return `<h1>Documentos</h1><div class="intro"><b>¿Qué estoy viendo?</b> Las liquidaciones cargadas. Cada número de la app se puede buscar en el PDF original: en el detalle de cada gasto figura la página.</div>
  <ul class="list docs">${[...C.ids].reverse().map(id => { const p = C.P(id), v = C.validations(id), url = (state.docs || {})[id];
    return `<li><div><b>Liquidación ${esc(p.Liquidacion)} — ${labelCap(id)}</b><span>Vencimiento ${fmtDate(p.Fecha_Vencimiento)} · cierre ${fmtDate(p.Fecha_Cierre)} · ${esc(p.Paginas)} páginas</span><span>${esc(p.Fuente_PDF)}</span></div>
    <div class="r"><b>Gastos ${money(p.Total_Gastos_Periodo)}</b><span>${v.ok} de ${v.total} controles dan bien</span>${url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noopener">Abrir el PDF</a>` : `<span>PDF disponible solo para la administración</span>`}</div></li>`; }).join("")}</ul>`;
}
function historico() {
  return `<h1>Todos los meses</h1><div class="intro"><b>¿Qué estoy viendo?</b> Los números principales de cada liquidación, tal como figuran en el documento.</div><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="r">Gastos</th><th class="r">Repartido entre lotes</th><th class="r">Lote común</th><th class="r">Entró</th><th class="r">Salió</th><th class="r">Cuenta al cierre</th></tr></thead><tbody>
  ${C.periods.map(p => `<tr><td>${labelCap(p.ID_Periodo)}</td><td class="r">${money(p.Total_Gastos_Periodo)}</td><td class="r">${money(p.Base_Prorrateo_Ord)}</td><td class="r">${money(p.Expensa_Ord_Lote_Tipo)}</td><td class="r">${money(p.Ingresos)}</td><td class="r">${money(p.Egresos_Caja)}</td><td class="r">${money(p.Saldo_Final)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ---------- Cargar ---------- */
function cargar() {
  const d = state.draft;
  return `<h1>Cargar una liquidación</h1>
  <div class="intro"><b>Solo para la administración del portal.</b> Elija el PDF tal como lo baja AdminProp. La app lo lee en este navegador (sin costo), lo controla y muestra el resultado. No se guarda nada hasta confirmar.</div>
  ${CFG.API_URL ? `<label class="fld">Clave de administración<input id="tok" type="password" autocomplete="off" value="${esc(state.token)}"></label>` : `<p class="intro">Todavía no está conectada la planilla (falta la dirección del script en <code>API_URL</code>). Se puede probar la lectura del PDF: se muestra lo leído, pero no se guarda.</p>`}
  <label class="fld">PDF de la liquidación<input id="pdf" type="file" accept="application/pdf"></label>
  <button id="go-pdf" class="btn">${ico("upload")} Leer y controlar</button>
  <div id="busy" class="busy" hidden>Leyendo la liquidación…</div>
  <div id="prev">${d ? preview(d) : ""}</div>`;
}
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(pdfjsLib); }; s.onerror = () => rej(new Error("No se pudo cargar el lector de PDF. Revise la conexión.")); document.head.appendChild(s); });
}
function localPreview(liq, file) {
  const s = liq.gastos.reduce((a, g) => a + (+g.importe || 0), 0);
  return { periodo: liq.periodo, bloqueos: ["Vista previa: la planilla no está conectada, no se puede incorporar."], draftId: null,
    resumen: { "Período": liq.periodo, "Archivo": file, "Total de gastos": liq.total_gastos, "Repartido entre lotes": (liq.prorrateo_totales || {}).gastos_ord, "Expensa lote común": (liq.cupon || {}).gastos_ord, "Cuenta al cierre": ((liq.fondos || {}).TOTAL || {}).saldo_final, "Ítems de gasto": String(liq.gastos.length), "Lotes": String(liq.prorrateo.length) },
    controles: [{ control: "Suma de ítems = TOTAL DE GASTOS", documento: liq.total_gastos, calculado: Math.round(s * 100) / 100, ok: Math.abs(s - liq.total_gastos) < 0.01 }],
    gastos: liq.gastos.map(g => ({ concepto_original: g.concepto_original, concepto_normalizado: g.rubro, categoria: "—", importe: g.importe })), observaciones: [], dudas: liq.dudas };
}
function preview(d) {
  const r = d.resumen || {}, bloq = d.bloqueos || [];
  return `<h2>Resultado: liquidación ${esc(d.periodo)}</h2>
  <table class="tbl"><tbody>${Object.entries(r).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${typeof v === "number" ? money(v) : esc(v)}</td></tr>`).join("")}</tbody></table>
  ${bloq.length ? `<article class="al lv-rojo"><h3>No se puede incorporar todavía</h3><ul>${bloq.map(b => `<li>${esc(b)}</li>`).join("")}</ul></article>` : ""}
  <h2>Controles (${d.controles.filter(c => c.ok).length} de ${d.controles.length} dan bien)</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Control</th><th class="r">Liquidación</th><th class="r">Calculado</th><th></th></tr></thead><tbody>
  ${d.controles.map(c => `<tr class="${c.ok ? "" : "flag"}"><td>${esc(c.control)}</td><td class="r">${money(c.documento)}</td><td class="r">${money(c.calculado)}</td><td>${c.ok ? "✓" : "✗"}</td></tr>`).join("")}</tbody></table></div>
  <h2>Gastos leídos (${d.gastos.length})</h2>
  <div class="scroll"><table class="tbl"><thead><tr><th>Concepto</th><th>Grupo</th><th class="r">Importe</th></tr></thead><tbody>
  ${d.gastos.map(g => `<tr class="${g.sin_regla ? "flag" : ""}"><td>${esc(g.concepto_normalizado)}<small>${esc(String(g.concepto_original).slice(0, 90))}</small></td><td>${esc(g.categoria)}</td><td class="r">${money(g.importe)}</td></tr>`).join("")}</tbody></table></div>
  ${(d.observaciones || []).length ? `<h2>Observaciones que se van a registrar</h2><ul>${d.observaciones.map(o => `<li>${esc(o.importancia)} ${esc(o.dato)}: ${esc(o.problema)}</li>`).join("")}</ul>` : ""}
  ${(d.dudas || []).length ? `<h2>Datos que la lectura no pudo confirmar</h2><ul>${d.dudas.map(o => `<li>${esc(o.campo)}: ${esc(o.detalle)} (pág. ${esc(o.pagina)})</li>`).join("")}</ul>` : ""}
  ${d.draftId ? `<div class="actions">${bloq.length ? `<label class="chk"><input type="checkbox" id="force"> Incorporar igual y dejar todo marcado para revisar</label>` : ""}
  <button id="commit" class="btn">Incorporar a la base</button><button id="discard" class="btn ghost">Descartar</button></div>` : ""}`;
}
async function api(body) { const r = await fetch(CFG.API_URL, { method: "POST", body: JSON.stringify(body) }); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
function bindCargar() {
  if (!$("#go-pdf")) return;
  $("#go-pdf").onclick = async () => {
    const f = $("#pdf").files[0]; if (!f) return toast("Elija el PDF de la liquidación.");
    $("#busy").hidden = false; $("#go-pdf").disabled = true;
    try {
      const buf = new Uint8Array(await f.arrayBuffer()), lib = await loadPdfJs(), liq = await LiqParser.fromFile(lib, buf.slice());
      if (!liq.periodo || !liq.gastos.length) throw new Error("No se reconoció el formato de la liquidación. ¿Es el PDF original de AdminProp?");
      if (!CFG.API_URL) state.draft = localPreview(liq, f.name);
      else {
        state.token = $("#tok").value.trim(); sessionStorage.setItem("portal_token", state.token);
        let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        state.draft = (await api({ action: "preview", token: state.token, filename: f.name, json: JSON.stringify(liq), pdfBase64: btoa(bin) })).preview;
      }
      $("#prev").innerHTML = preview(state.draft); bindPreview();
    } catch (e) { toast(e.message); } finally { $("#busy").hidden = true; $("#go-pdf").disabled = false; }
  };
  if (state.draft) bindPreview();
}
function bindPreview() {
  const c = $("#commit"), d = $("#discard"); if (!c) return;
  c.onclick = async () => { c.disabled = true; try { const j = await api({ action: "commit", token: state.token, draftId: state.draft.draftId, force: !!($("#force") && $("#force").checked) }); toast(`Liquidación ${j.periodo} incorporada.`); state.draft = null; animated = {}; await load(); go("inicio"); } catch (e) { toast(e.message); c.disabled = false; } };
  d.onclick = () => { state.draft = null; render(); };
}

/* ---------- Gráficos ---------- */
const PAL = ["#1F5C46", "#E9A23B", "#3F7CB8", "#B8402F"];
const yTick = v => "$ " + (Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " M" : (v / 1e3).toLocaleString("es-AR", { maximumFractionDigits: 0 }) + " mil");
function opts(stacked) { return { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
  plugins: { legend: { labels: { font: { family: "Atkinson Hyperlegible", size: 13 }, boxWidth: 14 } }, tooltip: { bodyFont: { size: 14 }, callbacks: { label: c => ` ${c.dataset.label}: ${money(c.parsed.y)}` } } },
  scales: { y: { stacked, ticks: { callback: yTick, font: { size: 12 } }, grid: { color: "#E3EAE6" } }, x: { stacked, grid: { display: false }, ticks: { font: { size: 12 } } } } }; }
function barsChart(s, labels, data, name) { const el = $(s); if (!el) return; charts.push(new Chart(el, { type: "bar", data: { labels, datasets: [{ label: name, data, backgroundColor: data.map((_, i) => i === data.length - 1 ? "#1F5C46" : "#9CC3AE"), borderRadius: 6 }] }, options: { ...opts(false), plugins: { ...opts(false).plugins, legend: { display: false } } } })); }
function lines(s, labels, sets) { const el = $(s); if (!el) return; charts.push(new Chart(el, { type: "line", data: { labels, datasets: sets.map((d, i) => ({ ...d, borderColor: PAL[i], backgroundColor: PAL[i], borderWidth: 3, pointRadius: 4, tension: 0 })) }, options: opts(false) })); }
function stacked(s, labels, sets) { const el = $(s); if (!el) return; charts.push(new Chart(el, { type: "bar", data: { labels, datasets: sets.map((d, i) => ({ ...d, backgroundColor: PAL[i * 3] || PAL[i], borderRadius: 4 })) }, options: opts(true) })); }

let toastT; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 5000); }
document.addEventListener("DOMContentLoaded", () => {
  const sz = store.get("portal_size") || "1"; document.documentElement.dataset.size = sz;
  $("#size").onclick = () => { const nx = String(((+document.documentElement.dataset.size || 1) % 3) + 1); document.documentElement.dataset.size = nx; store.set("portal_size", nx); toast(["Letra normal", "Letra grande", "Letra más grande"][nx - 1]); render(); };
  $("#periodo").onchange = e => { sel = e.target.value; catSel = 0; render(); };
  document.title = `Expensas ${CFG.BARRIO}`; $("#barrio").textContent = CFG.BARRIO;
  load();
});
</script>
</body>
</html>
