<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#0E1A2B;--muted:#5A6678;--line:#E2E7EE;--navy:#0E2240;--navy2:#1B3A66;--navy-soft:#E8EEF7;
 --ok:#16804F;--ok-soft:#E3F3EA;--warn:#A66A08;--warn-soft:#FBF1DC;--red:#B8322A;--red-soft:#FBE6E3;--rym:#8A94A6;
 --font:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}h2{font-size:1.15rem;font-weight:700;margin:2rem 0 .7rem}h3{font-size:1rem;font-weight:700}
p{margin:.3rem 0 .7rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.ico{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* header */
.top{background:var(--navy);color:#fff;padding:.8rem max(16px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto;min-width:0}
.brand .lg{width:34px;height:34px;border-radius:9px;background:#fff1;display:grid;place-items:center;flex:none}
.brand .lg svg{width:22px;height:22px;stroke:#34C27F;stroke-width:3}
.brand b{display:block;font-weight:800;font-size:1.02rem;line-height:1.1}.brand span{font-size:.78rem;opacity:.75}
.top select{background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:.45rem .6rem}
.top select option{color:var(--ink)}
.top a.lnk{color:#fff;opacity:.85;font-size:.85rem;text-decoration:none;border:1px solid #ffffff30;border-radius:10px;padding:.45rem .7rem;white-space:nowrap}
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:19;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:0 max(10px,calc((100vw - 1180px)/2))}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:.85rem .8rem .75rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-size:.93rem}
.tabs button.on{color:var(--navy);border-bottom-color:var(--ok)}
main{max-width:1180px;margin:0 auto;padding:1.4rem 16px 3rem}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 2rem;color:var(--muted);font-size:.8rem}
/* blocks */
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin:0 0 .3rem}
.lead{color:var(--muted);max-width:760px;font-size:1.02rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;margin:0 0 1rem}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}.card-h h2,.card-h h3{margin:0 0 .6rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.hero{display:grid;grid-template-columns:1fr;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;margin:1rem 0}
@media (min-width:760px){.hero{grid-template-columns:1fr 1fr auto}}
.hero>div{padding:1.2rem 1.3rem}
.hero .rym{border-bottom:1px solid var(--line)}@media (min-width:760px){.hero .rym{border-bottom:0;border-right:1px solid var(--line)}}
.hero .mod{background:linear-gradient(180deg,var(--ok-soft),#fff)}
.hero .dif{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:center;min-width:220px}
.hero small{display:block;font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hero .dif small{color:#C9D5E8}
.hero b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:.2rem 0}
.hero .rym b{color:var(--rym)}.hero .mod b{color:var(--ok)}
.hero p{margin:0;font-size:.88rem;color:var(--muted)}.hero .dif p{color:#DCE5F2}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.kpi small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.kpi b{display:block;font-size:1.35rem;font-weight:800;margin:.15rem 0}
.kpi span{font-size:.82rem;color:var(--muted)}
.kpi.ok b{color:var(--ok)}.kpi.red b{color:var(--red)}.kpi.warn b{color:var(--warn)}
.chart{position:relative;height:260px}
/* tables */
.tw{overflow-x:auto;margin:0 -.2rem}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
.t th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:.5rem .55rem;border-bottom:2px solid var(--line);white-space:nowrap}
.t td{padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
.t .r{text-align:right;white-space:nowrap}
.t tr.sub td{background:var(--navy-soft);font-weight:700}
.t tr.tot td{border-top:2px solid var(--navy);font-weight:800;font-size:.98rem}
.t tr.grp td{font-weight:700;color:var(--navy);padding-top:1rem;border-bottom:1px solid var(--navy-soft)}
.pos{color:var(--red);font-weight:700}.neg{color:var(--ok);font-weight:700}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:.1rem .4rem;margin-left:.3rem;vertical-align:1px;white-space:nowrap}
.tag.dato{background:var(--navy-soft);color:var(--navy2)}.tag.calc{background:#EEE8FB;color:#5B3FA8}.tag.hip{background:var(--warn-soft);color:var(--warn)}.tag.rev{background:var(--red-soft);color:var(--red)}.tag.prop{background:var(--ok-soft);color:var(--ok)}
.ck{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;font-weight:800;font-size:.85rem}
.ck.si{background:var(--ok-soft);color:var(--ok)}.ck.no{background:var(--red-soft);color:var(--red)}.ck.nd{background:var(--line);color:var(--muted)}
.note{background:var(--navy-soft);border-radius:12px;padding:.75rem .9rem;font-size:.9rem;margin:.6rem 0 1rem}
.note.warn{background:var(--warn-soft)}
.fine{font-size:.8rem;color:var(--muted)}
.list{list-style:none;padding:0;margin:0}.list li{padding:.6rem 0;border-bottom:1px solid var(--line);display:flex;gap:.7rem;align-items:flex-start}.list li:last-child{border-bottom:0}
.list .amt{margin-left:auto;font-weight:800;white-space:nowrap;text-align:right}
.btn{display:inline-flex;align-items:center;gap:.45rem;background:var(--navy);color:#fff;border:0;border-radius:11px;padding:.65rem 1rem;font-weight:700;min-height:44px}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0 1rem}
.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.82rem;font-weight:600;color:var(--muted)}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:10px;padding:.5rem .6rem;background:#fff;color:var(--ink);font-weight:500;min-width:8rem}
.sw{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--line)}
.sw input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--ok);flex:none}
.sw .amt{margin-left:auto;font-weight:800;white-space:nowrap}
.simw{display:grid;grid-template-columns:1fr;gap:1rem;align-items:start}@media (min-width:960px){.simw{grid-template-columns:1fr 300px}}
.sim{display:grid;grid-template-columns:1fr;gap:.2rem 1rem}
@media (min-width:760px){.sim{grid-template-columns:1fr 1fr}}
.sl{display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--navy)}
.sl b{font-weight:700}.sl span{text-align:right;font-weight:700;color:var(--navy)}
.sl small{grid-column:1/-1;color:var(--muted);font-size:.78rem}
.res{background:var(--navy);color:#fff;border-radius:16px;padding:1.1rem 1.2rem;position:sticky;top:120px}
.res small{color:#C9D5E8;display:block;font-size:.8rem}.res b{display:block;font-size:1.5rem;font-weight:800;margin:.1rem 0 .7rem}
.std{display:grid;grid-template-columns:auto 1fr;gap:.6rem;padding:.65rem 0;border-bottom:1px solid var(--line);align-items:start}
.std p{margin:.1rem 0 0;font-size:.85rem;color:var(--muted)}
.score{font-size:2.4rem;font-weight:800;color:var(--navy);line-height:1}
.mtx td,.mtx th{text-align:center}.mtx td:first-child,.mtx th:first-child{text-align:left}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.6rem 1.5rem;max-width:900px}
.doc-h{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:3px solid var(--navy);padding-bottom:.9rem;margin-bottom:.4rem}
.doc-h h1{font-size:1.35rem;margin:0}.doc-h .meta{font-size:.85rem;color:var(--muted);text-align:right}
.doc h2{font-size:1rem;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);margin:1.6rem 0 .5rem}
.wm{font-size:.78rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:.45rem .6rem;margin:.6rem 0}
.empty{color:var(--muted);font-style:italic}
.no-print{}
@media (max-width:560px){.top{position:static}.tabs{top:0}h1{font-size:1.45rem}.hero b{font-size:1.6rem}.top a.lnk{display:none}.brand span{display:none}.doc{padding:1.1rem .9rem}.t{font-size:.84rem}.res{position:static}}
@media print{
 @page{margin:14mm 12mm}
 body{background:#fff;font-size:10.5pt}
 .top,.tabs,.foot,.no-print{display:none!important}

 .doc{border:0;padding:0;max-width:none}
 .t tr{break-inside:avoid}.doc h2{break-after:avoid}
}
</style>

la", "Patron_En_PDF": "la huella", "Lotes": 21, "Superficie_m2": 11000, "Coef_FBV_Propios": 0.15368, "Coef_FBV_Comunes": 0.14293, "Estado": "HABILITADO", "Fuente": "Lotes y coeficientes: liquidaciones 09/2026. Superficie: relevamiento del propietario (pedir dato oficial)."}, {"ID_Barrio": "PREDIO", "Nombre": "Predio Nuevo Bella Vista (total)", "Patron_En_PDF": "", "Lotes": "", "Superficie_m2": 250000, "Coef_FBV_Propios": "", "Coef_FBV_Comunes": "", "Estado": "", "Fuente": "Superficie total informada (25 ha)"}], "HALLAZGOS": [{"ID_Hallazgo": "H01", "Orden": 1, "Gravedad": "CRÍTICO", "Titulo": "Se cobró más de lo que se gastó en septiembre", "Conclusion_Simple": "En septiembre, a los propietarios de los tres barrios se les pidió más plata que lo que se gastó en el mes: $4.474.330 de más entre los tres. En Senderos II, $1.627.055 (17%).", "Detalle_Tecnico": "En junio, julio y agosto lo repartido entre los lotes coincidió con el gasto del mes (diferencias de $30 a $45). En septiembre el salto es simultáneo en los tres barrios. La administración lo explicó como 'previsión de morosidad'. Para Senderos II el cálculo cierra aproximadamente: $9.565.568,34 × 1,17 = $11.191.714,96, $908,04 menos que lo repartido. La previsión no figura en ninguna línea de la liquidación, no se aplicó en los meses anteriores y no se informó cómo se devuelve cuando los morosos paguen. En Senderos I fue 10,7% y en La Huella 19,0%.", "Barrios": "S1,S2,LH", "Monto_Total": 4474330, "Impacto_S1": 1023710, "Impacto_S2": 1627055, "Impacto_LH": 1823565, "Tipo_Impacto": "A RECUPERAR", "Recurrencia": "ÚNICO", "Periodo_Afectado": "Septiembre 2026", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RESPONDIDO PARCIALMENTE", "Respuesta_Administracion": "Previsión de morosidad de lotes con deuda (aprox. 17% en Senderos II).", "Que_Pedir": "Composición exacta de la base de septiembre en cada barrio; por qué no se aplicó antes; cómo se devuelve o compensa el adelanto cuando los morosos paguen.", "Proximo_Paso": "Reiterar el pedido por escrito (el plazo de la carta 3 venció) y exigir que la previsión se informe como una línea separada en la liquidación.", "Fuentes": "Liquidaciones 06 a 09/2026; carta 3; resumen ejecutivo", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H02", "Orden": 2, "Gravedad": "CRÍTICO", "Titulo": "El 'mantenimiento' del Fideicomiso cobra casi la mitad del costo a barrios que son el 14% del predio", "Conclusion_Simple": "Los tres barrios ocupan alrededor del 14% del predio de 25 hectáreas, pero pagan el 43,8% del costo de mantenerlo. Senderos II paga $1.443.645 por mes por este concepto.", "Detalle_Tecnico": "El pozo de $10.665.223,73 se parte 80% 'propios' y 20% 'comunes' y a cada parte se le aplica un coeficiente por barrio. Senderos II: 13,73% y 12,76%. La aplicación es aritméticamente correcta, pero el criterio no está fundado: el corte 80/20 no tiene base de costo y los coeficientes difieren entre las dos mitades, lo que contradice que ambos se repartan por superficie. Según la administración, el mantenimiento cubre todo Nuevo Bella Vista (colegio, Vistana y tierra sin vender incluidos) con un criterio acordado con el desarrollador, que los propietarios no aprobaron. Superficies según relevamiento del propietario: el dato oficial debe pedirse.", "Barrios": "S1,S2,LH", "Monto_Total": 4670829, "Impacto_S1": 1611089, "Impacto_S2": 1443645, "Impacto_LH": 1616095, "Tipo_Impacto": "CRITERIO EN DISCUSIÓN", "Recurrencia": "", "Periodo_Afectado": "Mensual", "Verificacion": "VERIFICADO (CRITERIO)", "Estado_Reclamo": "RESPONDIDO SIN FUNDAMENTO", "Respuesta_Administracion": "Cubre todo el predio; criterio acordado con el desarrollador.", "Que_Pedir": "Fundamento del reparto; tabla completa de coeficientes y m² de todos los participantes del predio (período actual); fundamento del corte 80/20; detalle de tareas y frecuencia.", "Proximo_Paso": "Llevar a asamblea y elevar el planteo al Fideicomiso, coordinando con propietarios de Senderos I y La Huella.", "Fuentes": "Liquidaciones 09/2026 de los 3 barrios; respaldo de OP; carta 3", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H03", "Orden": 3, "Gravedad": "IMPORTANTE", "Titulo": "El 92% del 'mantenimiento' es el personal del Fideicomiso", "Conclusion_Simple": "Lo que se cobra como 'mantenimiento' es, en su gran mayoría, sueldos y cargas sociales del personal del Fideicomiso, que trabaja para todo el predio.", "Detalle_Tecnico": "Del total ajustado de $10.665.223,73, $9.833.981,59 (92,2%) son sueldos, cargas sociales, sindicato y honorarios de liquidación. Ningún empleado figura asignado a un barrio. Se necesita el convenio o acta que habilita trasladar esa nómina a los barrios (no hay escrituras ni consorcio constituido).", "Barrios": "S1,S2,LH", "Monto_Total": 9833982, "Impacto_S1": 1485523, "Impacto_S2": 1331128, "Impacto_LH": 1490155, "Tipo_Impacto": "CRITERIO EN DISCUSIÓN", "Recurrencia": "", "Periodo_Afectado": "Mensual", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RECLAMADO", "Respuesta_Administracion": "Indicó que el personal trabaja en todo el predio, incluidas obras y Vistana.", "Que_Pedir": "Convenio o acta que autoriza el traslado de la nómina; detalle de tareas por barrio; recibos de sueldo y F.931.", "Proximo_Paso": "Incluir en el pedido formal al Fideicomiso.", "Fuentes": "Respaldo de órdenes de pago; carta 3", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "TRANSPARENCIA", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H04", "Orden": 4, "Gravedad": "IMPORTANTE", "Titulo": "Electricidad industrial del Fideicomiso dentro del mantenimiento", "Conclusion_Simple": "Dentro del mantenimiento se reparte una factura de luz de tarifa industrial a nombre del Fideicomiso ($738.398). A Senderos II le toca $99.950 por mes.", "Detalle_Tecnico": "OP 2431: EDENOR cuenta 7884753119, tarifa T1-G2 industrial, $738.398,14. Es adicional al medidor propio de cada barrio. La administración dijo que Vistana se alimenta de la 'cuenta general' del Fideicomiso: si es esta cuenta, los propietarios estarían pagando luz de obra.", "Barrios": "S1,S2,LH", "Monto_Total": 738398.14, "Impacto_S1": 111542, "Impacto_S2": 99950, "Impacto_LH": 111889, "Tipo_Impacto": "A RECUPERAR", "Recurrencia": "MENSUAL", "Periodo_Afectado": "Mensual (si se repite)", "Verificacion": "VERIFICADO", "Estado_Reclamo": "RECLAMADO", "Respuesta_Administracion": "Vistana se alimenta de la 'cuenta general' del Fideicomiso.", "Que_Pedir": "Confirmar si la OP 2431 (cuenta 7884753119) es esa 'cuenta general'; si lo es, excluirla de la base.", "Proximo_Paso": "Reiterar el pedido.", "Fuentes": "Respaldo OP 2431; carta 3", "Mes": "2026-09", "Publicable": "SI", "Estado": "EN GESTIÓN", "Categoria_Problema": "ECONÓMICO", "Origen": "AUDITORÍA", "Fecha_Alta": "2026-09-14", "Fecha_Solucion": "", "Como_Se_Resolvio": "", "Ultima_Actualizacion": "2026-09-14"}, {"ID_Hallazgo": "H05", "Orden": 5, "Gravedad": "IMPORTANTE", "Titulo": "Honorarios de liquidación de sueldos del Fideicomiso", "Conclusion_Simple": "Se reparte entre los barrios un gasto administrativo propio del Fideicomiso: los honorarios de quien liquida sus sueldos ($101.000). A Senderos II le toca $13.671.", "Detalle_Tecnico": "OP 487: $101.000. Es un costo de la estructura del Fideicomiso y se suma a los honorarios que ya cobra la administradora RyM ($578.000 por barrio).", "Barrios": "S1,S2,LH", "Monto_Total": 101000, "Impacto_S1": 15257, "Impacto_S2": 13671, "Impacto_LH": 15305, "Tipo_Im const tag = k => `<span class="tag ${T[k][1]}">${T[k][0]}</span>`;
const pctIn = v => (v * 100).toLocaleString("es-AR", { maximumFractionDigits: 2 });
const parsePct = s => { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? v / 100 : 0; };

let DATA, C, barrio, sel, view = store.get("mod_view") || "resumen", charts = [], after = [], source = "guardados en la página";
const VIEWS = [["resumen", "Resumen"], ["liquidacion", "Liquidación modelo"], ["diferencias", "Diferencias con RyM"], ["ahorros", "Ahorros posibles"], ["presupuesto", "Presupuesto"], ["estandar", "Estándar de transparencia"]];
const S = () => DATA.sheets;
const bRow = (b = barrio) => S().BARRIOS.find(x => x.ID_Barrio === b) || {};
const bName = (b = barrio) => bRow(b).Nombre || b;
const lotesOf = id => n(C.P(id).Cantidad_Unidades) || n(bRow().Lotes);
const catName = k => Plain.cat(k).nombre;
const catColor = k => Plain.cat(k).color;

/* ---------- Inflación: solo como dato de referencia, no se compara con nada ---------- */
function ipcRef(mes) {
  const r = (S().INDICES || []).find(x => String(x.Mes).slice(0, 7) === mes);
  return r && n(r.IPC_Var_Mensual) ? `Inflación de ${label(mes)} (INDEC): ${pct(n(r.IPC_Var_Mensual), false)}` : `Inflación de ${label(mes)} (INDEC): aún no publicada`;
}

/* ---------- Modelo ---------- */
function coefLote(id) { const p = C.P(id), b = n(p.Base_Prorrateo_Ord), e = n(p.Expensa_Ord_Lote_Tipo); if (b && e) return e / b; const c = n(p.Coef_Lote_Tipo); return c ? (c > 1 ? c / 100 : c) : null; }
const HS = () => S().HALLAZGOS || [];
const cerrado = h => h.Estado === "SOLUCIONADO" || h.Estado === "DESCARTADO";
const deBarrio = h => String(h.Barrios || "").split(",").map(s => s.trim()).includes(barrio);
const impacto = h => n(h["Impacto_" + barrio]);
/** Ajustes que la auditoría reclama sobre el gasto de este mes (se aplican a elección). */
function ajustes(id) {
  const ev = C.EV(id), dif = n(ev.Dif_Base_vs_Gastos);
  return HS().filter(h => deBarrio(h) && !cerrado(h) && String(h.Mes).slice(0, 7) === mesOf(id) && impacto(h) > 0)
    .filter(h => Math.abs(impacto(h) - dif) > 2)
    .filter(h => { const t = String(h.Tipo_Impacto || ""), r = String(h.Recurrencia || ""); return (/^A RECUPERAR|^REDISTRIBUCI/.test(t)) && (r === "MENSUAL" || (r === "ÚNICO" && String(h.Periodo_Afectado).toLowerCase() === label(id))); })
    .map(h => ({ id: h.ID_Hallazgo, titulo: h.Titulo, monto: impacto(h), tipo: h.Tipo_Impacto, def: h.Tipo_Impacto === "A RECUPERAR", texto: h.Conclusion_Simple }));
}
function ajState(id) { try { return JSON.parse(store.get("mod_aj_" + barrio + id) || "{}"); } catch { return {}; } }
const ajOn = (id, a) => { const st = ajState(id); return a.id in st ? !!st[a.id] : a.def; };
const reservaPct = () => parsePct(store.get("mod_reserva") ?? "0");
function modelo(id) {
  const p = C.P(id), tg = C.totalGastos(id), base = n(p.Base_Prorrateo_Ord), coef = coefLote(id), lotes = lotesOf(id);
  const aj = ajustes(id).filter(a => ajOn(id, a)), ajT = aj.reduce((s, a) => s + a.monto, 0);
  const neto = tg - ajT, rp = reservaPct(), reserva = neto * rp, total = neto + reserva;
  return { tg, base, coef, lotes, aj, ajT, neto, rp, reserva, total, lRyM: n(p.Expensa_Ord_Lote_Tipo), lReal: coef ? tg * coef : null, lMod: coef ? total * coef : null };
}
/** Plata que la auditoría identifica a favor del barrio (montos únicos). */
function aRecuperar() {
  return HS().filter(h => deBarrio(h) && !cerrado(h) && impacto(h) > 0 && String(h.Recurrencia) === "ÚNICO" && /^A RECUPERAR|^A CONFIRMAR/.test(h.Tipo_Impacto || ""))
    .map(h => ({ id: h.ID_Hallazgo, titulo: h.Titulo, monto: impacto(h), confirmar: /CONFIRMAR/.test(h.Tipo_Impacto), periodo: h.Periodo_Afectado, estado: h.Estado }));
}
/** Señales de revisión de la liquidación del mes. */
function senales(id) {
  const o = [], G = C.G(id);
  const dup = G.filter(g => g.Posible_Duplicado); if (dup.length) o.push({ t: "Posibles facturas repetidas", x: dup.map(g => `${g.Concepto_Normalizado} ${m0(n(g.Importe))} (${g.Comprobante || "N/D"})`).join("; "), m: dup.reduce((a, g) => a + n(g.Importe), 0) });
  const est = G.filter(g => g.Es_Estimado === "SI"); if (est.length) o.push({ t: "Importes estimados, sin factura", x: est.map(g => `${g.Concepto_Normalizado} ${m0(n(g.Importe))}`).join("; "), m: est.reduce((a, g) => a + n(g.Importe), 0) });
  const nd = G.filter(g => !g.Comprobante || g.Comprobante === "N/D"); if (nd.length) o.push({ t: `${nd.length} de ${G.length} gastos sin número de comprobante`, x: nd.map(g => g.Concepto_Normalizado).join(", "), m: nd.reduce((a, g) => a + n(g.Importe), 0) });
  const E = S().EGRESOS_CAJA.filter(e => e.ID_Periodo === id);
  const sd = E.filter(e => e.Tipo_Egreso === "EGRESO SIN DETALLE DE COMPROBANTE"); if (sd.length) o.push({ t: "Pagos que salieron de la cuenta sin comprobante detallado", x: `${sd.length} movimientos.`, m: -sd.reduce((a, e) => a + n(e.Importe), 0) });
  const aj = E.filter(e => e.Tipo_Egreso === "AJUSTE"); if (aj.length) o.push({ t: "Ajustes de caja sin explicación", x: aj.map(e => e.Concepto).join("; "), m: -aj.reduce((a, e) => a + n(e.Importe), 0) });
  const nid = S().INGRESOS.filter(i => i.ID_Periodo === id && i.Origen === "Cobros no identificados"); if (nid.length) o.push({ t: "Cobranza sin identificar a qué lote corresponde", x: "", m: nid.reduce((a, i) => a + n(i.Importe), 0) });
  return o;
}

/* ---------- Estándar de transparencia ---------- */
const CRIT = [
  ["Se reparte lo que se gastó", "Lo pedido a los propietarios coincide con el total de gastos (tolerancia $1.000).", id => Math.abs(n(C.P(id).Base_Prorrateo_Ord) - C.totalGastos(id)) <= 1000],
  ["Las sumas cierran", "Subtotales y totales de la liquidación coinciden con sus componentes.", id => { const v = S().VALIDACIONES.filter(x => x.ID_Periodo === id && !/Base prorrateada|Duplicados/.test(x.Control)); return v.length ? v.every(x => String(x.Resultado).startsWith("🟢")) : null; }],
  ["Sin facturas repetidas", "Ningún gasto coincide en concepto, importe y comprobante con otro.", id => !C.G(id).some(g => g.Posible_Duplicado)],
  ["Sin importes estimados", "Cada gasto liquidado tiene su factura.", id => !C.G(id).some(g => g.Es_Estimado === "SI")],
  ["Cada gasto con comprobante", "Todos los gastos informan número de factura u orden de pago.", id => !C.G(id).some(g => !g.Comprobante || g.Comprobante === "N/D")],
  ["Pagos con respaldo", "No sale plata de la cuenta sin un gasto detallado.", id => !S().EGRESOS_CAJA.some(e => e.ID_Periodo === id && e.Tipo_Egreso === "EGRESO SIN DETALLE DE COMPROBANTE")],
  ["Sin ajustes inexplicados", "No hay movimientos de ajuste sin explicación.", id => !S().EGRESOS_CAJA.some(e => e.ID_Periodo === id && e.Tipo_Egreso === "AJUSTE")],
  ["Caja conciliada", "Saldo inicial + ingresos − egresos = saldo final, y el saldo inicial es el final del mes anterior.", id => { const f = C.fondo(id, "TOTAL"); return f.ID_Periodo ? Math.abs(n(f.Diferencia)) < 1 && /OK/.test(f.Continuidad || "") : null; }],
  ["Cobranza identificada", "Cada cobro se asigna a un lote.", id => !S().INGRESOS.some(i => i.ID_Periodo === id && i.Origen === "Cobros no identificados" && n(i.Importe))],
  ["Fondo de reserva informado", "La liquidación muestra el ahorro para imprevistos.", id => !!n(C.P(id).Fondo_Reserva)],
];
const score = id => { const r = CRIT.map(c => c[2](id)), v = r.filter(x => x != null); return { r, ok: v.filter(Boolean).length, tot: v.length }; };

/* ---------- Gráficos ---------- */
const MOD = "#16804F", RYM = "#8A94A6", NAVY = "#0E2240";
function mk(sel, cfg) { const el = $(sel); if (!el || !window.Chart) return; Chart.defaults.font.family = "Public Sans, system-ui, sans-serif"; Chart.defaults.color = "#5A6678"; charts.push(new Chart(el, cfg)); }
const yMoney = { ticks: { callback: v => "$ " + (Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " M" : Math.round(v / 1e3).toLocaleString("es-AR") + " mil") }, grid: { color: "#EEF1F5" } };
const ttMoney = { callbacks: { label: c => `${c.dataset.label}: ${m0(c.parsed.y)}` } };

/* ---------- RESUMEN ---------- */
function resumen() {
  const id = sel, M = modelo(id), d = M.lMod != null ? M.lRyM - M.lMod : null, rec = aRecuperar(), recT = rec.reduce((a, r) => a + r.monto, 0);
  const sc = score(id), se = senales(id), nRev = se.length + (M.base - M.tg > 1000 ? 1 : 0), top = rubrosSuba(id)[0];
  after.push(() => mk("#chRes", { type: "bar", data: { labels: C.withSpend.map(short), datasets: [
    { label: "Lote común según RyM", data: C.withSpend.map(i => n(C.P(i).Expensa_Ord_Lote_Tipo)), backgroundColor: RYM, borderRadius: 6 },
    { label: "Lote común modelo (lo gastado)", data: C.withSpend.map(i => { const c = coefLote(i); return c ? C.totalGastos(i) * c : null; }), backgroundColor: MOD, borderRadius: 6 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom" }, tooltip: ttMoney }, scales: { y: { ...yMoney, beginAtZero: false, min: 0 }, x: { grid: { display: false } } } } }));
  return `<p class="eyebrow">${esc(bName())} · ${esc(labelCap(id))}</p>
  <h1>La expensa, como debería liquidarse</h1>
  <p class="lead">Tomamos la liquidación oficial de RyM y la rehacemos con sus propios números: se reparte lo que se gastó, cada diferencia queda a la vista y se buscan ahorros. No reemplaza a la liquidación oficial; sirve para controlarla y para mostrar cómo se puede hacer mejor.</p>
  <section class="hero">
    <div class="rym"><small>Liquidación RyM · lote común</small><b>${money(M.lRyM)}</b><p>Lo que figura en la liquidación oficial.</p></div>
    <div class="mod"><small>Liquidación modelo · lote común</small><b>${M.lMod != null ? money(M.lMod) : "N/D"}</b><p>${M.aj.length ? `Lo gastado, menos ${M.aj.length} ajuste${M.aj.length > 1 ? "s" : ""} reclamado${M.aj.length > 1 ? "s" : ""}` : "Prorrateando lo efectivamente gastado"}${M.rp ? `, más ${pctIn(M.rp)}% al fondo de reserva` : ""}.</p></div>
    <div class="dif"><small>Diferencia por lote común</small><b>${d != null ? sgn(d) : "N/D"}</b><p>${d != null && M.lRyM ? `${pct(d / M.lRyM, false)} de la expensa. ${d > 0 ? "RyM pide más que el modelo." : d < 0 ? "El modelo pide más (por el fondo de reserva)." : ""}` : ""}</p></div>
  </section>
  <p class="fine">Referencia · ${esc(ipcRef(mesOf(id)))}</p>
  <section class="grid g4">
    <div class="kpi ${M.base - M.tg > 1000 ? "red" : "ok"}"><small>Pedido de más en el mes</small><b>${m0(M.base - M.tg)}</b><span>${m0(M.base)} pedidos vs ${m0(M.tg)} gastados</span></div>
    <div class="kpi ${recT ? "warn" : ""}"><small>Plata a reclamar</small><b>${m0(recT)}</b><span>${rec.length} reclamos con monto a favor del barrio</span></div>
    <div class="kpi ${nRev ? "warn" : "ok"}"><small>Puntos a revisar</small><b>${nRev}</b><span>${top && top.dif > 0 ? `El rubro que más subió: ${esc(catName(top.k))} (+${m0(top.dif)} desde ${esc(short(C.withSpend[0]))})` : "en la liquidación de este mes"}</span></div>
    <div class="kpi ${sc.ok / sc.tot >= .8 ? "ok" : sc.ok / sc.tot >= .5 ? "warn" : "red"}"><small>Estándar de transparencia</small><b>${sc.ok} de ${sc.tot}</b><span>criterios cumplidos este mes</span></div>
  </section>
  <section class="grid g2" style="margin-top:1rem">
    <div class="card"><div class="card-h"><h3>Expensa de un lote común: RyM y modelo</h3></div><div class="chart"><canvas id="chRes"></canvas></div><p class="fine">El modelo multiplica lo gastado en el mes por el coeficiente del lote común que usa RyM. ${tag("calc")}</p></div>
    <div class="card"><div class="card-h"><h3>Lo que una administración modelo haría distinto este mes</h3></div><ul class="list">
      ${M.base - M.tg > 1000 ? `<li><div><b>Repartir solo lo gastado.</b><br><span class="fine">Se pidieron ${m0(M.base - M.tg)} más que el gasto, sin explicación en la liquidación.</span></div><button class="btn ghost" data-go="diferencias">Ver</button></li>` : ""}
      ${se.slice(0, 3).map(x => `<li><div><b>${esc(x.t)}.</b><br><span class="fine">${esc(x.x).slice(0, 160)}</span></div><span class="amt">${m0(x.m)}</span></li>`).join("")}
      ${!n(C.P(id).Fondo_Reserva) ? `<li><div><b>Informar el fondo de reserva.</b><br><span class="fine">La liquidación no muestra ahorro para imprevistos.</span></div><button class="btn ghost" data-go="liquidacion">Ver</button></li>` : ""}
    </ul></div>
  </section>`;
}

/* ---------- LIQUIDACIÓN MODELO ---------- */
function liquidacion() {
  const id = sel, p = C.P(id), M = modelo(id), G = C.G(id), aj = ajustes(id);
  const cats = [...new Set(G.map(g => g.Categoria))].map(k => ({ k, rows: G.filter(g => g.Categoria === k), tot: G.filter(g => g.Categoria === k).reduce((a, g) => a + n(g.Importe), 0) })).sort((a, b) => b.tot - a.tot);
  const flags = g => `${g.Posible_Duplicado ? tag("rev") : ""}${g.Es_Estimado === "SI" ? `<span class="tag hip">Estimado</span>` : ""}`;
  const ING = S().INGRESOS.filter(i => i.ID_Periodo === id), EGR = S().EGRESOS_CAJA.filter(e => e.ID_Periodo === id), FT = C.fondo(id, "TOTAL");
  const gsum = (rows, k) => { const m = new Map(); rows.forEach(r => m.set(r[k], (m.get(r[k]) || 0) + n(r.Importe))); return [...m]; };
  const ev = C.EV(id), deuda = n(ev.Deudas_A_Cobrar) + n(ev.Intereses_A_Cobrar), se = senales(id);
  return `<div class="no-print"><p class="eyebrow">${esc(bName())}</p><h1>Liquidación modelo</h1>
    <p class="lead">Así se vería la expensa de ${esc(label(id))} presentada con claridad. Elija qué ajustes aplicar y si se aparta un fondo de reserva; el documento se actualiza y se puede descargar en PDF para enviar.</p>
    <div class="grid g2"><div class="card"><h3>Ajustes reclamados por la auditoría</h3>
      ${aj.length ? aj.map(a => `<label class="sw"><input type="checkbox" data-aj="${a.id}" ${ajOn(id, a) ? "checked" : ""}><span><b>${esc(a.titulo)}</b><br><span class="fine">${esc(a.id)} · ${esc(a.tipo.toLowerCase())}. Monto que corresponde a ${esc(bName())}.</span></span><span class="amt">−${m0(a.monto)}</span></label>`).join("") : `<p class="empty">No hay ajustes con monto para este mes.</p>`}
      <p class="fine">Son criterios de la auditoría de propietarios, todavía no aceptados por la administración. ${tag("hip")}</p></div>
      <div class="card"><h3>Fondo de reserva</h3><p class="fine">Una administración prolija aparta todos los meses un porcentaje del gasto para imprevistos y lo informa en la liquidación.</p>
      <div class="bar"><label class="fld">Aporte mensual (% del gasto)<input id="resPct" inputmode="decimal" value="${pctIn(M.rp)}"></label><button class="btn ghost" data-res="5">Probar 5%</button><button class="btn ghost" data-res="0">Sin aporte</button></div>
      <p class="fine">Con ${pctIn(M.rp)}%: ${m0(M.reserva)} por mes para el barrio${M.coef ? `, ${m0(M.reserva * M.coef)} por lote común` : ""}. ${tag("prop")}</p></div></div>
    <div class="bar"><button class="btn" id="print">Descargar PDF</button><span class="fine">En el celular: Compartir → Imprimir → Guardar como PDF.</span></div></div>
  <article class="doc">
    <div class="doc-h"><div><p class="eyebrow">Liquidación modelo de expensas</p><h1>${esc(bName())} · ${esc(labelCap(id))}</h1><p class="fine">${lotesOf(id)} unidades · Fideicomiso Bella Vista</p></div>
      <div class="meta">Vencimiento oficial: ${p.Fecha_Vencimiento && p.Fecha_Vencimiento !== "N/D" ? esc(new Date(p.Fecha_Vencimiento + "T12:00").toLocaleDateString("es-AR")) : "N/D"}<br>Fuente: liquidación ${esc(p.Liquidacion || "")} de RyM Administración</div></div>
    <p class="wm">Elaborada por propietarios con los datos de la liquidación oficial. No reemplaza a la liquidación de la administración ni modifica lo que hay que pagar.</p>

    <h2>1. Gastos del mes</h2>
    <div class="tw"><table class="t"><thead><tr><th>Concepto</th><th>Comprobante</th><th class="r">Importe</th></tr></thead><tbody>
      ${cats.map(c => `<tr class="grp"><td colspan="2">${esc(catName(c.k))}</td><td class="r">${pct(c.tot / M.tg, false)}</td></tr>
        ${c.rows.map(g => `<tr><td>${esc(g.Concepto_Normalizado)}${flags(g)}${g.Proveedor && g.Proveedor !== "N/D" ? `<br><span class="fine">${esc(g.Proveedor)}</span>` : ""}</td><td class="fine">${esc(g.Comprobante || "N/D")}</td><td class="r">${money(n(g.Importe))}</td></tr>`).join("")}
        <tr class="sub"><td colspan="2">Subtotal ${esc(catName(c.k).toLowerCase())}</td><td class="r">${money(c.tot)}</td></tr>`).join("")}
      <tr class="tot"><td colspan="2">Total de gastos del mes ${tag("dato")}</td><td class="r">${money(M.tg)}</td></tr></tbody></table></div>

    <h2>2. Total a repartir</h2>
    <div class="tw"><table class="t"><tbody>
      <tr><td>Total de gastos del mes</td><td class="r">${money(M.tg)}</td></tr>
      ${M.aj.map(a => `<tr><td>Menos: ${esc(a.titulo)} <span class="tag hip">Ajuste ${esc(a.id)}</span></td><td class="r">−${money(a.monto)}</td></tr>`).join("")}
      ${M.rp ? `<tr><td>Más: aporte al fondo de reserva (${pctIn(M.rp)}%) ${tag("prop")}</td><td class="r">${money(M.reserva)}</td></tr>` : ""}
      <tr class="tot"><td>Total a repartir (modelo)</td><td class="r">${money(M.total)}</td></tr>
      <tr><td class="fine">Total que repartió RyM</td><td class="r fine">${money(M.base)}</td></tr>
    </tbody></table></div>
    ${n(p.Gastos_Particulares) ? `<p class="fine">Además, la liquidación oficial carga ${money(n(p.Gastos_Particulares))} de gastos particulares a unidades determinadas; no se reparten entre todos.</p>` : ""}

    <h2>3. Cuánto le toca a cada lote</h2>
    <div class="tw"><table class="t"><thead><tr><th>Tipo de unidad</th><th class="r">Coeficiente</th><th class="r">RyM</th><th class="r">Modelo</th><th class="r">Diferencia</th></tr></thead><tbody>
      <tr><td>Lote común</td><td class="r">${M.coef ? (M.coef * 100).toLocaleString("es-AR", { minimumFractionDigits: 4, maximumFractionDigits: 4 }) + "%" : "N/D"}</td><td class="r">${money(M.lRyM)}</td><td class="r"><b>${M.lMod != null ? money(M.lMod) : "N/D"}</b></td><td class="r ${cls(M.lMod - M.lRyM)}">${M.lMod != null ? sgn(M.lMod - M.lRyM) : "N/D"}</td></tr>
    </tbody></table></div>
    <p class="fine">El coeficiente surge de dividir la expensa del lote común por el total repartido en la liquidación oficial ${tag("calc")}. Para otros tipos de unidad se aplica su propio coeficiente sobre el mismo total; la liquidación en PDF solo informa el del lote común.</p>

    <h2>4. Estado de la cuenta del barrio</h2>
    <div class="tw"><table class="t"><tbody>
      <tr><td>Saldo al inicio del mes</td><td class="r">${money(n(FT.Saldo_Inicial))}</td></tr>
      ${gsum(ING, "Origen").map(([k, v]) => `<tr><td>Más: ${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join("")}
      ${gsum(EGR, "Tipo_Egreso").map(([k, v]) => `<tr><td>Menos: ${esc(k.charAt(0) + k.slice(1).toLowerCase())}</td><td class="r">${money(v)}</td></tr>`).join("")}
      <tr class="tot"><td>Saldo al cierre</td><td class="r">${money(n(FT.Saldo_Final_Documento))}</td></tr>
      <tr><td class="fine">Control: la cuenta cierra ${tag("calc")}</td><td class="r fine">${FT.ID_Periodo ? (Math.abs(n(FT.Diferencia)) < 1 ? "Sí" : "No, diferencia " + money(n(FT.Diferencia))) : "N/D"}</td></tr>
    </tbody></table></div>
    <p class="fine">Fondo ordinario ${money(n(C.fondo(id, "ORDINARIO").Saldo_Final_Documento))} · Fondo extraordinario ${money(n(C.fondo(id, "EXTRAORDINARIO").Saldo_Final_Documento))} · Fondo de reserva: ${n(p.Fondo_Reserva) ? money(n(p.Fondo_Reserva)) : "no informado en la liquidación oficial"}.</p>

    <h2>5. Deuda de propietarios</h2>
    <p>${money(deuda)} (capital ${money(n(ev.Deudas_A_Cobrar))} e intereses ${money(n(ev.Intereses_A_Cobrar))}); ${n(ev.Unidades_Con_Deuda)} de ${lotesOf(id)} unidades con deuda. El detalle por unidad no se publica.</p>

    <h2>6. Puntos a revisar en la liquidación oficial</h2>

/* ---------- AHORROS ---------- */
function rubrosSuba(id) {
  const first = C.withSpend[0]; if (!first || first === id) return [];
  const cs = k => i => C.G(i).filter(g => g.Categoria === k).reduce((a, g) => a + n(g.Importe), 0);
  return [...new Set(C.G(id).map(g => g.Categoria))].map(k => { const a = cs(k)(first), b = cs(k)(id); return { k, a, b, v: a ? b / a - 1 : null, dif: b - a }; }).filter(x => x.a && x.b).sort((x, y) => y.dif - x.dif);
}
function comparacion(id) {
  const rows = S().COMPARATIVO_AUDITORIA || []; const meses = [...new Set(rows.map(r => r.Mes))].filter(m => m <= mesOf(id)).sort(); const mes = meses.pop(); if (!mes) return null;
  const R = rows.filter(r => r.Mes === mes), bs = [...new Set(R.map(r => r.Barrio))]; if (!bs.includes(barrio) || bs.length < 2) return null;
  const conc = [...new Set(R.map(r => r.Concepto))].filter(c => !/Pedido a propietarios/.test(c));
  const L = b => n(bRow(b).Lotes) || 1, M2 = b => n(bRow(b).Superficie_m2);
  const val = (b, c) => n((R.find(r => r.Barrio === b && r.Concepto === c) || {}).Importe);
  return { mes, bs, rows: conc.map(c => { const pl = bs.map(b => val(b, c) / L(b)), mine = val(barrio, c) / L(barrio), min = Math.min(...pl.filter(Boolean)), bmin = bs[pl.indexOf(min)];
    return { c, pl, mine, min, bmin, gap: mine > min && bmin !== barrio ? (mine - min) * L(barrio) : 0, m2: bs.map(b => M2(b) ? val(b, c) / M2(b) : null) }; }) };
}

function bind() {
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-aj]").forEach(c => c.onchange = () => { const st = ajState(sel); st[c.dataset.aj] = c.checked; store.set("mod_aj_" + barrio + sel, JSON.stringify(st)); keep(render); });
  const rp = $("#resPct"); if (rp) rp.onchange = () => { store.set("mod_reserva", rp.value); keep(render); };
  document.querySelectorAll("[data-res]").forEach(b => b.onclick = () => { store.set("mod_reserva", b.dataset.res); keep(render); });
  const pi = $("#preInf"); if (pi) pi.onchange = () => { store.set("mod_aum", pi.value); keep(render); };
  const pb = $("#preBase"); if (pb) pb.onchange = () => { store.set("mod_base", pb.value); keep(render); };
  const pr = $("#print"); if (pr) pr.onclick = () => { const t = document.title; document.title = `Liquidacion modelo ${bName()} ${label(sel)}`; window.print(); setTimeout(() => document.title = t, 1000); };
  document.querySelectorAll("[data-sim]").forEach(r => r.oninput = () => { sim[r.dataset.sim] = +r.value; store.set("mod_sim", JSON.stringify(sim)); const s = document.querySelector(`[data-sv="${CSS.escape(r.dataset.sim)}"]`); if (s) s.textContent = +r.value ? (r.value > 0 ? "+" : "") + r.value + "%" : "Sin cambio"; simUpdate(); });
  const sr = $("#simReset"); if (sr) sr.onclick = () => { store.set("mod_sim", "{}"); keep(render); };
  if ($("#simRes")) simUpdate();
}
const keep = f => { const y = window.scrollY; f(); window.scrollTo({ top: y }); };
function fill() {
  const bs = S().BARRIOS.filter(b => S().PERIODOS.some(p => p.Barrio === b.ID_Barrio));
  $("#barrioSel").innerHTML = bs.map(b => `<option value="${b.ID_Barrio}" ${b.ID_Barrio === barrio ? "selected" : ""}>${esc(b.Nombre)}</option>`).join("");
  C = Core.make(DATA, barrio); const ids = C.withSpend; if (!ids.includes(sel)) sel = ids[ids.length - 1];
  $("#periodo").innerHTML = ids.slice().reverse().map(i => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(labelCap(i))}</option>`).join("");
}
async function init() {
  let data = JSON.parse($("#snapshot").textContent);
  if (CFG.API_URL && location.protocol !== "file:") {
    try { const r = await fetch(CFG.API_URL + "?action=data", { cache: "no-store" }); const d = await r.json(); if (!d.sheets) throw new Error(d.error || "Respuesta inválida"); data = d; source = "en vivo"; } catch (e) { console.warn(e); }
  }
  DATA = data; barrio = store.get("portal_barrio") || "S2"; if (!S().BARRIOS.some(b => b.ID_Barrio === barrio) || !S().PERIODOS.some(p => p.Barrio === barrio)) barrio = "S2";
  fill();
  $("#src").textContent = `Datos ${source}${data.updated ? " · actualizados " + data.updated : ""}. Fuente: liquidaciones mensuales de RyM Administración, cargadas en la planilla del portal.`;
  if (CFG.PORTAL_URL) $("#toPortal").href = CFG.PORTAL_URL;
  $("#barrioSel").onchange = e => { barrio = e.target.value; store.set("portal_barrio", barrio); sel = null; fill(); render(); };
  $("#periodo").onchange = e => { sel = e.target.value; render(); };
  render();
}
init();
</script>
</body>
</html>
